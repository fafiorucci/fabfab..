<title>Corso Patente Nautica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito+Sans:wght@400;600;700;800&display=swap">
<style>
/* Layout: una colonna centrata da quaderno di bordo; barra in alto con l'allievo, schede per lezione, visore slide 16:9, quiz a caselle. */
:root{
  --bg:#F6F3EC; --card:#FFFFFF; --ink:#16324F; --soft:#5E6E82; --line:#E3DED2;
  --sea:#0B8A99; --sea-t:#D5F3F5; --coral:#E4572E; --coral-t:#FFE3D9; --sun:#FFC145; --sun-t:#FFF0C9;
  --ok:#1E8E5A; --ok-t:#DFF3E4; --ko:#C8402A; --ko-t:#FCE3DD;
  --display:'Fredoka','Trebuchet MS',sans-serif; --body:'Nunito Sans',Arial,sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1E2E; --card:#16293D; --ink:#EAF1F7; --soft:#A7B6C6; --line:#25405A;
  --sea:#3CC3D2; --sea-t:#123B47; --coral:#FF7A55; --coral-t:#3D2219; --sun:#FFC145; --sun-t:#3A3017;
  --ok:#4FC98A; --ok-t:#14372A; --ko:#FF7A62; --ko-t:#3E1E19; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1E2E; --card:#16293D; --ink:#EAF1F7; --soft:#A7B6C6; --line:#25405A;
  --sea:#3CC3D2; --sea-t:#123B47; --coral:#FF7A55; --coral-t:#3D2219; --sun:#FFC145; --sun-t:#3A3017;
  --ok:#4FC98A; --ok-t:#14372A; --ko:#FF7A62; --ko-t:#3E1E19; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink); font-family:var(--body); font-size:16px; line-height:1.5}
.wrap{max-width:920px; margin:0 auto; padding-inline:16px; padding-block:0 48px}
header.bar{position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--bg); border-bottom:1px solid var(--line)}
header.bar .in{max-width:920px; margin:0 auto; padding:12px 16px; display:flex; align-items:center; gap:12px}
.brand{display:flex; align-items:center; gap:10px; cursor:pointer; background:none; border:0; color:var(--ink); padding:0; font:inherit}
.brand b{font-family:var(--display); font-size:20px; font-weight:600}
.brand small{display:block; font-size:12px; color:var(--soft); font-weight:700; letter-spacing:.04em; text-transform:uppercase}
.spacer{flex:1}
.who{display:flex; align-items:center; gap:8px; font-weight:700; font-size:14px}
.who img{width:30px; height:30px; border-radius:50%}
h1,h2,h3{font-family:var(--display); font-weight:600; line-height:1.15; text-wrap:balance; margin:0}
h1{font-size:clamp(26px,4vw,34px)} h2{font-size:22px} h3{font-size:18px}
p{margin:0}
.muted{color:var(--soft)}
.eyebrow{font-size:12px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--sea)}
.stack{display:flex; flex-direction:column; gap:16px}
.row{display:flex; gap:12px; flex-wrap:wrap; align-items:center}
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:20px}
.btn{font:inherit; font-weight:800; font-size:15px; border-radius:999px; padding:10px 18px; border:2px solid var(--ink); background:var(--ink); color:var(--bg); cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; gap:8px}
.btn.ghost{background:transparent; color:var(--ink)}
.btn.sea{background:var(--sea); border-color:var(--sea); color:#fff}
.btn.coral{background:var(--coral); border-color:var(--coral); color:#fff}
.btn:disabled{opacity:.45; cursor:not-allowed}
.btn:focus-visible,.opt:focus-visible,.brand:focus-visible,.link:focus-visible{outline:3px solid var(--sun); outline-offset:2px}
.link{background:none; border:0; padding:0; font:inherit; font-weight:800; color:var(--sea); cursor:pointer; text-decoration:underline; text-underline-offset:3px}
.bar-p{height:8px; border-radius:99px; background:var(--line); overflow:hidden}
.bar-p i{display:block; height:100%; background:var(--sea); border-radius:99px}
.stats{display:grid; grid-template-columns:repeat(3,1fr); gap:12px}
.stat{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:14px 16px}
.stat b{display:block; font-family:var(--display); font-size:28px; font-weight:600; font-variant-numeric:tabular-nums}
.stat span{font-size:13px; color:var(--soft); font-weight:700}
.lez{display:grid; grid-template-columns:auto 1fr auto; gap:16px; align-items:center}
.lez .n{width:56px; height:56px; border-radius:14px; background:var(--sea-t); color:var(--sea); font-family:var(--display); font-size:24px; font-weight:700; display:grid; place-items:center}
.lez.locked .n{background:var(--line); color:var(--soft)}
.chip{font-size:12px; font-weight:800; padding:3px 10px; border-radius:99px; background:var(--line); color:var(--soft); white-space:nowrap}
.chip.ok{background:var(--ok-t); color:var(--ok)} .chip.ko{background:var(--ko-t); color:var(--ko)} .chip.todo{background:var(--sun-t); color:#8a5a00}
:root[data-theme="dark"] .chip.todo{color:var(--sun)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip.todo{color:var(--sun)}}
.cap{display:grid; grid-template-columns:1fr auto; gap:12px; align-items:center; padding:14px 0; border-top:1px solid var(--line)}
.cap:first-child{border-top:0}
.viewer{background:#0B1622; border-radius:var(--r); overflow:hidden}
.viewer img{display:block; width:100%; aspect-ratio:16/9; object-fit:contain; background:#0B1622}
.vnav{display:flex; align-items:center; gap:12px; justify-content:space-between; flex-wrap:wrap}
.counter{font-variant-numeric:tabular-nums; font-weight:800; color:var(--soft)}
.q{display:flex; flex-direction:column; gap:10px}
.q .qid{font-size:12px; font-weight:800; color:var(--coral); letter-spacing:.04em}
.q .txt{font-weight:800; font-size:17px}
.opt{display:flex; gap:12px; align-items:flex-start; text-align:left; width:100%; font:inherit; color:var(--ink); background:var(--card); border:2px solid var(--line); border-radius:12px; padding:12px 14px; cursor:pointer}
.opt .box{flex:none; width:22px; height:22px; border-radius:6px; border:2px solid var(--soft); margin-top:2px; display:grid; place-items:center}
.opt[aria-checked="true"]{border-color:var(--sea)} .opt[aria-checked="true"] .box{border-color:var(--sea); background:var(--sea)}
.opt[aria-checked="true"] .box::after{content:""; width:8px; height:12px; border:solid #fff; border-width:0 3px 3px 0; transform:rotate(45deg) translate(-1px,-1px)}
.opt.right{border-color:var(--ok); background:var(--ok-t)} .opt.wrong{border-color:var(--ko); background:var(--ko-t)}
.opt:disabled{cursor:default}
.fb{border-radius:12px; padding:12px 14px; font-weight:700}
.fb.ok{background:var(--ok-t); color:var(--ok)} .fb.ko{background:var(--ko-t); color:var(--ko)}
.fb .link{color:inherit}
table{border-collapse:collapse; width:100%; font-size:15px}
th,td{text-align:left; padding:8px 10px; border-bottom:1px solid var(--line)}
th{font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--soft)}
td.num{font-variant-numeric:tabular-nums; text-align:right} th.num{text-align:right}
.tbl{overflow-x:auto}
.notice{background:var(--sun-t); border-radius:12px; padding:10px 14px; font-size:14px; font-weight:700}
label.fld{display:flex; flex-direction:column; gap:6px; font-weight:800}
input[type=text]{font:inherit; padding:10px 12px; border-radius:10px; border:2px solid var(--line); background:var(--card); color:var(--ink)}
input[type=text]:focus{outline:none; border-color:var(--sea)}
.check{display:flex; gap:10px; align-items:flex-start; font-size:14px}
.check input{margin-top:4px; width:18px; height:18px; accent-color:var(--sea)}
.hero{display:grid; grid-template-columns:1.3fr 1fr; gap:24px; align-items:center}
.hero svg{width:100%; height:auto}
@media (max-width:640px){.hero{grid-template-columns:1fr} .stats{grid-template-columns:1fr 1fr 1fr} .stat b{font-size:22px} .lez{grid-template-columns:auto 1fr} .lez .go{grid-column:1/-1}}
@media (prefers-reduced-motion: no-preference){.opt,.btn{transition:background .15s, border-color .15s}}
</style>

<header class="bar"><div class="in">
  <button class="brand" id="home-btn" aria-label="Torna alla home">
    <svg width="34" height="34" viewBox="0 0 200 200" aria-hidden="true"><circle cx="100" cy="100" r="92" fill="none" stroke="currentColor" stroke-width="10"/><path d="M97 42 L97 132 L46 132 Q66 92 97 42 Z" fill="currentColor"/><path d="M104 54 L104 132 L148 132 Q128 96 104 54 Z" fill="#FFC145"/><path d="M44 140 L156 140 Q148 156 126 158 L74 158 Q52 156 44 140 Z" fill="currentColor"/></svg>
    <span><b>Corso Patente Nautica</b><small>Fabrizio Fiorucci · prototipo</small></span>
  </button>
  <span class="spacer"></span>
  <span class="who" id="who"></span>
</div></header>

<main class="wrap" id="app">
  <div class="stack" style="padding-block:32px">
    <p class="eyebrow">Caricamento</p>
    <h1>Preparo le lezioni 1 e 2…</h1>
  </div>
</main>

<script>
(function(){
const $app=document.getElementById('app'), $who=document.getElementById('who');
let C=null, S=null, uid=null, me=null, db=null, mode='local';
const KEY='corso-nautico-v1';
const blank=()=>({nome:'',consenso:false,creato:null,visti:{},risposte:{}});

/* ---------- archivio: db personale se disponibile, altrimenti questo dispositivo ---------- */
const store={
  async load(){
    try{
      const user=await claude.use('user');
      if(user){ me=await user.me(); uid=me.id; }
      db=await claude.use('db');
      if(db && uid){
        const snap=await db.doc('data/users/'+uid+'/profile').get();
        mode='cloud';
        return snap.exists ? Object.assign(blank(),snap.data()) : blank();
      }
    }catch(e){ console.warn('db non disponibile',e); }
    mode='local';
    try{ const raw=localStorage.getItem(KEY); if(raw) return Object.assign(blank(),JSON.parse(raw)); }catch(e){}
    return blank();
  },
  t:null,
  save(){
    clearTimeout(this.t);
    this.t=setTimeout(async()=>{
      const body=JSON.parse(JSON.stringify(S));
      if(mode==='cloud'){
        try{ await db.doc('data/users/'+uid+'/profile').set(body); return; }
        catch(e){ console.warn('salvataggio non riuscito',e); }
      }
      try{ localStorage.setItem(KEY,JSON.stringify(body)); }catch(e){}
    },400);
  }
};

/* ---------- utilità ---------- */
const el=(tag,attrs={},...kids)=>{const n=document.createElement(tag);for(const[k,v] of Object.entries(attrs)){if(k==='class')n.className=v;else if(k.startsWith('on'))n.addEventListener(k.slice(2),v);else if(v!==false&&v!=null)n.setAttribute(k,v===true?'':v);}for(const k of kids.flat()){if(k==null||k===false)continue;n.append(k.nodeType?k:document.createTextNode(String(k)));}return n;};
const lez=id=>C.lezioni.find(l=>l.id===id);
const img=(L,p)=>'slides/'+L+'-'+String(p).padStart(3,'0')+'.jpg';
const allPages=L=>lez(L).capitoli.flatMap(c=>c.pagine);
const allQuiz=L=>lez(L).capitoli.flatMap(c=>c.quiz.flatMap(s=>s.ids));
const seen=L=>new Set(S.visti[L]||[]);
const ans=q=>S.risposte[q];
const pct=(a,b)=>b?Math.round(100*a/b):0;
function stato(L){
  const pages=allPages(L), sv=seen(L), qs=allQuiz(L);
  const fatti=qs.filter(q=>ans(q)), giusti=fatti.filter(q=>ans(q).ok);
  return {pagine:pages.length, viste:pages.filter(p=>sv.has(p)).length, quiz:qs.length, fatti:fatti.length, giusti:giusti.length, errati:fatti.length-giusti.length};
}
const errati=()=>Object.entries(S.risposte).filter(([q,a])=>!a.ok && C.quiz[q]).map(([q])=>q);
function bar(v){return el('div',{class:'bar-p',role:'progressbar','aria-valuenow':v,'aria-valuemin':0,'aria-valuemax':100},el('i',{style:'width:'+v+'%'}));}
function go(fn,...a){window.scrollTo({top:0}); fn(...a);}

function renderWho(){
  $who.replaceChildren();
  if(!S||!S.nome) return;
  if(me&&me.avatarUrl) $who.append(el('img',{src:me.avatarUrl,alt:''}));
  $who.append(el('span',{},S.nome));
}

/* ---------- registrazione ---------- */
function vRegistrazione(){
  const nome=el('input',{type:'text',id:'f-nome',autocomplete:'name',value:(me&&me.name)||'',placeholder:'Nome e cognome'});
  const cons=el('input',{type:'checkbox',id:'f-cons'});
  const btn=el('button',{class:'btn sea',type:'submit'},'Inizia il corso');
  const form=el('form',{class:'card stack',onsubmit:e=>{e.preventDefault();
      if(!nome.value.trim()){nome.focus();return;} if(!cons.checked){cons.focus();return;}
      S.nome=nome.value.trim(); S.consenso=true; S.creato=new Date().toISOString(); store.save(); renderWho(); go(vHome);}},
    el('h2',{},'Registrati'),
    el('label',{class:'fld',for:'f-nome'},'Il tuo nome',nome),
    el('label',{class:'check',for:'f-cons'},cons,el('span',{},'Acconsento al salvataggio del mio nome e dei miei progressi (slide viste, quiz risposti) per seguire il corso. Posso chiederne la cancellazione in ogni momento.')),
    btn);
  $app.replaceChildren(el('div',{class:'stack',style:'padding-block:28px'},
    el('div',{class:'hero'},
      el('div',{class:'stack'},
        el('p',{class:'eyebrow'},'Patente nautica · entro 12 miglia e senza limiti'),
        el('h1',{},'Il corso in tasca: lezioni, quiz ufficiali e i tuoi progressi'),
        el('p',{class:'muted'},'Studi le slide della lezione, fai le verifiche con i quiz del DD 131/2022 e, quando sbagli, torni alla slide che spiega l’argomento. In questo prototipo trovi le lezioni 1 e 2.')),
      heroArt()),
    form,
    mode==='local'?el('p',{class:'notice'},'Modalità prova: i progressi restano su questo dispositivo.'):null));
}
function heroArt(){
  const s=document.createElementNS('http://www.w3.org/2000/svg','svg');
  s.setAttribute('viewBox','0 0 320 200'); s.setAttribute('role','img'); s.setAttribute('aria-label','Rosa dei venti con la rotta tracciata');
  s.innerHTML='<circle cx="160" cy="100" r="86" fill="none" stroke="currentColor" stroke-opacity=".25" stroke-width="2"/><circle cx="160" cy="100" r="62" fill="none" stroke="currentColor" stroke-opacity=".15" stroke-width="2"/>'+
   Array.from({length:36},(_,i)=>{const a=i*10*Math.PI/180,r1=i%9===0?70:80;return `<line x1="${160+r1*Math.sin(a)}" y1="${100-r1*Math.cos(a)}" x2="${160+86*Math.sin(a)}" y2="${100-86*Math.cos(a)}" stroke="currentColor" stroke-opacity=".35" stroke-width="2"/>`}).join('')+
   '<path d="M160 22 L170 100 L160 178 L150 100 Z" fill="#E4572E"/><path d="M82 100 L160 92 L238 100 L160 108 Z" fill="currentColor" fill-opacity=".55"/><text x="160" y="16" text-anchor="middle" font-family="Fredoka, sans-serif" font-weight="600" font-size="14" fill="currentColor">N</text>'+
   '<path d="M40 170 L280 30" stroke="#0B8A99" stroke-width="3" stroke-dasharray="8 6" fill="none"/><circle cx="40" cy="170" r="6" fill="#0B8A99"/><circle cx="280" cy="30" r="7" fill="none" stroke="#E4572E" stroke-width="3"/>';
  s.style.color='var(--ink)'; return s;
}

/* ---------- home ---------- */
function vHome(){
  const tot=C.lezioni.map(l=>stato(l.id));
  const viste=tot.reduce((a,s)=>a+s.viste,0), pagine=tot.reduce((a,s)=>a+s.pagine,0);
  const fatti=tot.reduce((a,s)=>a+s.fatti,0), giusti=tot.reduce((a,s)=>a+s.giusti,0), quiz=tot.reduce((a,s)=>a+s.quiz,0);
  const err=errati();
  $app.replaceChildren(el('div',{class:'stack',style:'padding-block:28px'},
    el('div',{class:'stack',style:'gap:6px'},el('p',{class:'eyebrow'},'Il tuo corso'),el('h1',{},'Ciao '+S.nome.split(' ')[0]+', si riparte da qui')),
    el('div',{class:'stats'},
      el('div',{class:'stat'},el('b',{},pct(viste,pagine)+'%'),el('span',{},'slide studiate')),
      el('div',{class:'stat'},el('b',{},fatti+' / '+quiz),el('span',{},'quiz risposti')),
      el('div',{class:'stat'},el('b',{},fatti?pct(giusti,fatti)+'%':'—'),el('span',{},'risposte giuste'))),
    err.length?el('div',{class:'card row',style:'justify-content:space-between'},
      el('div',{},el('h3',{},'Hai '+err.length+(err.length===1?' quiz da ripassare':' quiz da ripassare')),el('p',{class:'muted'},'Riprova gli errori finché non diventano giusti.')),
      el('button',{class:'btn coral',onclick:()=>go(vQuiz,{titolo:'Ripasso degli errori',ids:err.slice(0,10),ritorno:['home']})},'Ripassa gli errori')):null,
    el('div',{class:'stack'},el('h2',{},'Le lezioni'),
      ...C.lezioni.map((l,i)=>{const s=stato(l.id); const v=pct(s.viste,s.pagine);
        return el('div',{class:'card lez'},
          el('div',{class:'n'},String(i+1)),
          el('div',{class:'stack',style:'gap:8px; min-width:0'},
            el('div',{},el('p',{class:'eyebrow'},l.num),el('h3',{},l.titolo)),
            bar(v),
            el('div',{class:'row',style:'gap:8px'},el('span',{class:'chip'},v+'% slide'),el('span',{class:'chip '+(s.fatti?'ok':'')},s.giusti+' giusti'),s.errati?el('span',{class:'chip ko'},s.errati+' errati'):null)),
          el('div',{class:'go'},el('button',{class:'btn',onclick:()=>go(vLezione,l.id)},s.viste?'Continua':'Inizia')));}),
      ...[3,4,5].map(n=>el('div',{class:'card lez locked'},el('div',{class:'n'},String(n)),el('div',{},el('p',{class:'eyebrow'},'Lezione '+String(n).padStart(2,'0')),el('h3',{class:'muted'},'Disponibile nella versione completa'))))),
    el('div',{class:'row'},el('button',{class:'link',onclick:()=>go(vStorico)},'Il tuo storico dei quiz')),
    mode==='local'?el('p',{class:'notice'},'Modalità prova: i progressi restano su questo dispositivo.'):null));
}

/* ---------- lezione ---------- */
function vLezione(L){
  const l=lez(L), sv=seen(L);
  $app.replaceChildren(el('div',{class:'stack',style:'padding-block:28px'},
    el('button',{class:'link',onclick:()=>go(vHome)},'← Tutte le lezioni'),
    el('div',{class:'stack',style:'gap:6px'},el('p',{class:'eyebrow'},l.num+' · 2 ore'),el('h1',{},l.titolo)),
    el('div',{class:'card'},...l.capitoli.map((c,ci)=>{
      const v=c.pagine.filter(p=>sv.has(p)).length;
      const qs=c.quiz.flatMap(s=>s.ids), fatti=qs.filter(ans), ok=fatti.filter(q=>ans(q).ok).length;
      const qstat=!qs.length?null:fatti.length<qs.length?el('span',{class:'chip todo'},qs.length+' quiz da fare'):ok===qs.length?el('span',{class:'chip ok'},'quiz superati'):el('span',{class:'chip ko'},(qs.length-ok)+' quiz errati');
      return el('div',{class:'cap'},
        el('div',{class:'stack',style:'gap:6px; min-width:0'},el('h3',{},c.titolo),
          el('div',{class:'row',style:'gap:8px'},el('span',{class:'chip '+(v===c.pagine.length?'ok':'')},v+' / '+c.pagine.length+' slide'),qstat)),
        el('div',{class:'row',style:'gap:8px; justify-content:flex-end'},
          el('button',{class:'btn ghost',onclick:()=>go(vSlide,L,ci,0)},'Studia'),
          ...c.quiz.length===1?[el('button',{class:'btn sea',onclick:()=>go(vQuiz,{titolo:c.quiz[0].titolo,ids:c.quiz[0].ids,ritorno:['lezione',L]})},'Verifica')]:
            c.quiz.length>1&&c.quiz.length<4?c.quiz.map((s,si)=>el('button',{class:'btn sea',onclick:()=>go(vQuiz,{titolo:s.titolo,ids:s.ids,ritorno:['lezione',L]})},'Verifica '+(si+1))):
            c.quiz.length?[el('button',{class:'btn sea',onclick:()=>go(vRaccolta,L,ci)},'Quiz ('+c.quiz.length+')')]:[]));
    }))));
}
function vRaccolta(L,ci){
  const c=lez(L).capitoli[ci];
  $app.replaceChildren(el('div',{class:'stack',style:'padding-block:28px'},
    el('button',{class:'link',onclick:()=>go(vLezione,L)},'← '+lez(L).num),
    el('div',{class:'stack',style:'gap:6px'},el('p',{class:'eyebrow'},'Ultimi 45 minuti'),el('h1',{},'Raccolta quiz')),
    el('div',{class:'card'},...c.quiz.map(s=>{const f=s.ids.filter(ans), ok=f.filter(q=>ans(q).ok).length;
      return el('div',{class:'cap'},el('div',{class:'stack',style:'gap:6px'},el('h3',{},s.titolo),
          el('span',{class:'chip '+(f.length===s.ids.length?(ok===s.ids.length?'ok':'ko'):'todo')},f.length<s.ids.length?s.ids.length+' quiz':ok+' / '+s.ids.length+' giusti')),
        el('button',{class:'btn sea',onclick:()=>go(vQuiz,{titolo:s.titolo,ids:s.ids,ritorno:['raccolta',L,ci]})},f.length?'Rifai':'Inizia'));}))));
}

/* ---------- visore slide ---------- */
function vSlide(L,ci,k){
  const c=lez(L).capitoli[ci], p=c.pagine[k];
  S.visti[L]=Array.from(new Set([...(S.visti[L]||[]),p])).sort((a,b)=>a-b); store.save();
  const last=k===c.pagine.length-1;
  const prev=el('button',{class:'btn ghost',disabled:k===0,onclick:()=>vSlide(L,ci,k-1)},'← Indietro');
  const next=last?(c.quiz.length?el('button',{class:'btn sea',onclick:()=>go(c.quiz.length>3?vRaccolta:vQuiz, ...(c.quiz.length>3?[L,ci]:[{titolo:c.quiz[0].titolo,ids:c.quiz.flatMap(s=>s.ids),ritorno:['lezione',L]}]))},'Fai la verifica →'):
      el('button',{class:'btn sea',onclick:()=>go(vLezione,L)},'Fine capitolo')):
      el('button',{class:'btn',onclick:()=>vSlide(L,ci,k+1)},'Avanti →');
  $app.replaceChildren(el('div',{class:'stack',style:'padding-block:20px'},
    el('div',{class:'row',style:'justify-content:space-between'},el('button',{class:'link',onclick:()=>go(vLezione,L)},'← '+lez(L).num),el('span',{class:'counter'},'slide '+p+' · '+(k+1)+' di '+c.pagine.length)),
    el('h2',{},c.titolo),
    el('div',{class:'viewer'},el('img',{src:img(L,p),alt:'Slide '+p+' della '+lez(L).num.toLowerCase()+': '+c.titolo})),
    el('div',{class:'vnav'},prev,next)));
  document.onkeydown=e=>{ if(!document.querySelector('.viewer'))return; if(e.key==='ArrowRight'&&!last)vSlide(L,ci,k+1); if(e.key==='ArrowLeft'&&k>0)vSlide(L,ci,k-1); };
}
function vRivedi(qid,back){
  const [L,p]=C.quiz[qid].rivedi; const l=lez(L);
  const ci=l.capitoli.findIndex(c=>c.pagine.includes(p)), k=l.capitoli[ci].pagine.indexOf(p);
  S.visti[L]=Array.from(new Set([...(S.visti[L]||[]),p])).sort((a,b)=>a-b); store.save();
  $app.replaceChildren(el('div',{class:'stack',style:'padding-block:20px'},
    el('div',{class:'row',style:'justify-content:space-between'},el('button',{class:'link',onclick:back},'← Torna al quiz'),el('span',{class:'counter'},l.num+' · slide '+p)),
    el('p',{class:'eyebrow'},'Rivedi l’argomento · quiz '+qid),
    el('h2',{},l.capitoli[ci].titolo),
    el('div',{class:'viewer'},el('img',{src:img(L,p),alt:'Slide '+p+' che spiega l’argomento del quiz '+qid})),
    el('div',{class:'card stack',style:'gap:6px'},el('p',{class:'muted'},'La domanda'),el('p',{style:'font-weight:800'},C.quiz[qid].d),el('p',{},'Risposta esatta: ',el('b',{},C.quiz[qid].r[C.quiz[qid].x]))),
    el('div',{class:'vnav'},el('button',{class:'btn ghost',onclick:()=>go(vSlide,L,ci,k)},'Continua a studiare da qui'),el('button',{class:'btn sea',onclick:back},'Torna al quiz'))));
}

/* ---------- quiz a caselle ---------- */
function vQuiz(set,state){
  state=state||{scelte:{},controllato:false};
  const back=()=>{const r=set.ritorno; if(r[0]==='lezione')go(vLezione,r[1]); else if(r[0]==='raccolta')go(vRaccolta,r[1],r[2]); else go(vHome);};
  const pronti=set.ids.every(q=>state.scelte[q]!=null);
  const items=set.ids.map((qid,n)=>{const q=C.quiz[qid], scelta=state.scelte[qid];
    const opts=q.r.map((r,j)=>{
      const cls=state.controllato?(j===q.x?'opt right':(j===scelta?'opt wrong':'opt')):'opt';
      return el('button',{class:cls,type:'button',role:'checkbox','aria-checked':String(scelta===j),disabled:state.controllato,
        onclick:()=>{state.scelte[qid]=j; vQuiz(set,state);}},el('span',{class:'box'}),el('span',{},'abc'[j]+') '+r));});
    let fb=null;
    if(state.controllato){ const ok=scelta===q.x;
      fb=el('div',{class:'fb '+(ok?'ok':'ko')},ok?'Giusto.':el('span',{},'Sbagliato: la risposta esatta è la '+'abc'[q.x]+'). ',
        el('button',{class:'link',onclick:()=>{window.scrollTo({top:0}); vRivedi(qid,()=>go(vQuiz,set,state));}},'Rivedi l’argomento → '+lez(q.rivedi[0]).num+', slide '+q.rivedi[1])));}
    return el('div',{class:'card q'},el('p',{class:'qid'},'Domanda '+(n+1)+' · quiz '+qid),el('p',{class:'txt'},q.d),...opts,fb);});
  const giusti=set.ids.filter(q=>state.scelte[q]===C.quiz[q].x).length;
  $app.replaceChildren(el('div',{class:'stack',style:'padding-block:24px'},
    el('button',{class:'link',onclick:back},'← Indietro'),
    el('div',{class:'stack',style:'gap:6px'},el('p',{class:'eyebrow'},'Quiz ufficiali DD 131/2022'),el('h1',{},set.titolo)),
    ...items,
    state.controllato?el('div',{class:'card row',style:'justify-content:space-between'},
        el('h3',{},giusti+' su '+set.ids.length+' giuste'),
        el('div',{class:'row'},el('button',{class:'btn ghost',onclick:()=>go(vQuiz,set)},'Rifai'),el('button',{class:'btn sea',onclick:back},'Continua'))):
      el('div',{class:'row'},el('button',{class:'btn sea',disabled:!pronti,onclick:()=>{
        state.controllato=true; const now=new Date().toISOString();
        for(const q of set.ids){const prev=S.risposte[q]; S.risposte[q]={ok:state.scelte[q]===C.quiz[q].x,scelta:state.scelte[q],ts:now,tentativi:(prev?prev.tentativi:0)+1};}
        store.save(); vQuiz(set,state);}},'Controlla le risposte'),
        pronti?null:el('span',{class:'muted'},'Scegli una risposta per ogni domanda'))));
}

/* ---------- storico ---------- */
function vStorico(){
  const rows=C.lezioni.map(l=>{const s=stato(l.id); return el('tr',{},el('td',{},l.num+' · '+l.titolo),el('td',{class:'num'},s.viste+' / '+s.pagine),el('td',{class:'num'},s.fatti+' / '+s.quiz),el('td',{class:'num'},s.giusti),el('td',{class:'num'},s.errati));});
  const err=errati();
  $app.replaceChildren(el('div',{class:'stack',style:'padding-block:28px'},
    el('button',{class:'link',onclick:()=>go(vHome)},'← Home'),
    el('div',{class:'stack',style:'gap:6px'},el('p',{class:'eyebrow'},'Storico'),el('h1',{},'I tuoi progressi')),
    el('div',{class:'card tbl'},el('table',{},el('thead',{},el('tr',{},el('th',{},'Lezione'),el('th',{class:'num'},'Slide'),el('th',{class:'num'},'Quiz risposti'),el('th',{class:'num'},'Giusti'),el('th',{class:'num'},'Errati'))),el('tbody',{},...rows))),
    el('h2',{},'Quiz da ripassare'),
    err.length?el('div',{class:'card'},...err.map(q=>{const Q=C.quiz[q];return el('div',{class:'cap'},
        el('div',{class:'stack',style:'gap:4px; min-width:0'},el('p',{class:'qid',style:'font-size:12px; font-weight:800; color:var(--coral)'},'quiz '+q+' · '+(S.risposte[q].tentativi)+(S.risposte[q].tentativi===1?' tentativo':' tentativi')),el('p',{style:'font-weight:700'},Q.d)),
        el('div',{class:'row',style:'gap:8px; justify-content:flex-end'},el('button',{class:'btn ghost',onclick:()=>{window.scrollTo({top:0}); vRivedi(q,()=>go(vStorico));}},'Rivedi'),el('button',{class:'btn sea',onclick:()=>go(vQuiz,{titolo:'Riprova il quiz '+q,ids:[q],ritorno:['home']})},'Riprova')));})):
      el('p',{class:'muted'},'Nessun errore da ripassare. Ottimo lavoro.')));
}

/* ---------- avvio ---------- */
document.getElementById('home-btn').addEventListener('click',()=>{ if(S&&S.nome) go(vHome); });
(async function start(){
  try{ C=await (await fetch('corso.json')).json(); }
  catch(e){ $app.replaceChildren(el('div',{class:'stack',style:'padding-block:32px'},el('h1',{},'Non riesco a caricare il corso'),el('p',{class:'muted'},'Ricarica la pagina; se il problema resta, avvisa l’istruttore.'))); return; }
  S=blank(); vRegistrazione();
  S=await store.load(); renderWho();
  if(S.nome) vHome(); else vRegistrazione();
})();
})();
