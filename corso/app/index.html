<title>Corso Patente Nautica</title>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito+Sans:wght@400;600;700;800;900&family=Caveat:wght@700&display=swap">
<style>
/* Layout: come le slide del corso. Barra blu notte con il logo, fondo carta con macchie colorate e onde,
   titoli con badge a macchia + etichetta colorata, schede bianche con il bordo colorato a sinistra. */
:root{
  --paper:#FFF8EE; --card:#FFFFFF; --ink:#1B2A41; --body:#34465E; --soft:#5E6E82; --line:#EDE5D6;
  --navy:#16324F; --navy-2:#1F4466; --navy-ink:#FFFFFF; --navy-soft:#C9D6E3; --dacc:#FFC145;
  --coral:#E4572E; --sea:#0B8A99; --sun:#F4A300; --green:#2E9E5B; --blue:#2F6FDB; --purple:#7B5CD6;
  --coral-t:#FFE3D9; --sea-t:#D5F3F5; --sun-t:#FFF0C9; --green-t:#DFF3E4; --blue-t:#E1EAFD; --lilac-t:#ECE6FB;
  --ok:#0B8A99; --ok-t:#D5F3F5; --ko:#C8402A; --ko-t:#FFE3D9; --shadow:0 8px 24px rgba(27,42,65,.10);
  --display:'Fredoka','Trebuchet MS',sans-serif; --text:'Nunito Sans',Arial,sans-serif; --hand:'Caveat','Brush Script MT',cursive;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0F1E2E; --card:#16293D; --ink:#EEF3F8; --body:#D3DEE9; --soft:#A7B6C6; --line:#25405A;
  --navy:#0B1826; --navy-2:#173350; --coral-t:#3D2219; --sea-t:#123B47; --sun-t:#3A3017; --green-t:#163626; --blue-t:#1B2B4A; --lilac-t:#2A2547;
  --coral:#FF7A55; --sea:#3CC3D2; --sun:#FFC145; --green:#4FC98A; --blue:#7FA8FF; --purple:#A891FF;
  --ok:#3CC3D2; --ok-t:#123B47; --ko:#FF7A62; --ko-t:#3E1E19; --shadow:0 8px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0F1E2E; --card:#16293D; --ink:#EEF3F8; --body:#D3DEE9; --soft:#A7B6C6; --line:#25405A;
  --navy:#0B1826; --navy-2:#173350; --coral-t:#3D2219; --sea-t:#123B47; --sun-t:#3A3017; --green-t:#163626; --blue-t:#1B2B4A; --lilac-t:#2A2547;
  --coral:#FF7A55; --sea:#3CC3D2; --sun:#FFC145; --green:#4FC98A; --blue:#7FA8FF; --purple:#A891FF;
  --ok:#3CC3D2; --ok-t:#123B47; --ko:#FF7A62; --ko-t:#3E1E19; --shadow:0 8px 24px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--paper)}
body{margin:0; color:var(--ink); font-family:var(--text); font-size:16px; line-height:1.5; min-height:100%}
.backdrop{position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden}
.backdrop svg{position:absolute}
header.bar,main,footer.foot{position:relative; z-index:1}
header.bar{position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--navy); color:var(--navy-ink)}
header.bar .in{max-width:960px; margin:0 auto; padding:10px 16px 6px; display:flex; align-items:center; gap:12px}
header.bar .waves{display:block; width:100%; height:14px}
.brand{display:flex; align-items:center; gap:12px; cursor:pointer; background:none; border:0; color:inherit; padding:0; font:inherit; text-align:left}
.brand svg{width:44px; height:44px; flex:none}
.brand b{display:block; font-family:var(--display); font-size:20px; font-weight:700; line-height:1.1}
.brand i{display:block; font-family:var(--hand); font-style:normal; font-size:20px; line-height:1; color:var(--dacc)}
.spacer{flex:1}
.nav{display:flex; gap:6px}
.nav[hidden]{display:none}
.navb{font:inherit; font-weight:800; font-size:14px; display:inline-flex; align-items:center; gap:6px; padding:7px 13px; border-radius:999px; border:2px solid rgba(255,248,238,.35); background:transparent; color:var(--navy-ink); cursor:pointer}
.navb svg{width:18px; height:18px}
.navb:hover{border-color:var(--dacc)}
.navb[aria-current="page"]{background:var(--dacc); border-color:var(--dacc); color:#16324F}
.navb:focus-visible{outline:3px solid var(--dacc); outline-offset:2px}
.tbl .sh{display:none}
.reset{display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between}
.who{display:flex; align-items:center; gap:8px; font-weight:800; font-size:14px; color:var(--navy-soft)}
.who img{width:30px; height:30px; border-radius:50%; border:2px solid var(--dacc)}
/* aiuto: pannello laterale, si apre solo quando serve */
.aiuto-ov{position:fixed; inset:0; z-index:40; background:rgba(11,24,38,.45)}
.aiuto{position:fixed; top:0; right:0; bottom:0; z-index:41; width:min(440px,100vw); background:var(--paper); color:var(--ink); box-shadow:-10px 0 30px rgba(0,0,0,.25); display:flex; flex-direction:column}
.aiuto .ah{background:var(--navy); color:#fff; padding:16px 18px; display:flex; align-items:center; gap:12px}
.aiuto .ah h2{color:#fff; font-size:21px; flex:1}
.aiuto .ax{width:40px; height:40px; border-radius:50%; border:0; background:rgba(255,255,255,.14); color:#fff; display:grid; place-items:center; cursor:pointer; flex:none}
.aiuto .ax svg{width:20px; height:20px}
.aiuto .ab{overflow:auto; padding:18px; display:flex; flex-direction:column; gap:16px}
.aiuto .qui{background:var(--card); border-radius:18px; padding:16px; border-left:8px solid var(--sea); box-shadow:var(--shadow)}
.aiuto .qui ul{margin:8px 0 0; padding-left:20px} .aiuto .qui li{margin:4px 0}
.aiuto details{background:var(--card); border-radius:14px; padding:12px 14px; border:2px solid var(--line)}
.aiuto summary{cursor:pointer; font-weight:800}
.aiuto details p,.aiuto details li{color:var(--body); font-size:15px; margin:8px 0 0}
.aiuto details ul{padding-left:20px; margin:0}
.aiuto .info{font-size:13px; color:var(--soft); font-weight:700}
.suggerimento{position:fixed; z-index:30; right:12px; top:76px; max-width:240px; background:var(--dacc); color:#16324F; font-weight:800; font-size:14px; border-radius:14px; padding:10px 34px 10px 12px; box-shadow:var(--shadow)}
.suggerimento::before{content:""; position:absolute; top:-8px; right:var(--fr,60px); border:8px solid transparent; border-top:0; border-bottom-color:var(--dacc)}
.suggerimento button{position:absolute; top:4px; right:6px; border:0; background:none; font:inherit; font-size:18px; color:#16324F; cursor:pointer}
.whob{display:flex; align-items:center; gap:8px; background:none; border:0; color:inherit; font:inherit; cursor:pointer; padding:2px; border-radius:999px}
.whob:focus-visible{outline:3px solid var(--dacc); outline-offset:2px}
.av{width:34px; height:34px; border-radius:50%; display:grid; place-items:center; color:#fff; font-family:var(--display); font-size:15px; border:2px solid var(--dacc); flex:none}
.whob[aria-current] .av{box-shadow:0 0 0 3px rgba(255,193,69,.45)}
/* profilo */
.seg{display:flex; flex-wrap:wrap; gap:8px}
.seg label{position:relative; cursor:pointer}
.seg input{position:absolute; opacity:0; inset:0; margin:0; cursor:pointer}
.seg span{display:inline-block; padding:8px 14px; border-radius:999px; border:2px solid var(--line); font-weight:800; font-size:14px; background:var(--card)}
.seg input:checked+span{border-color:var(--sea); background:var(--sea-t); color:var(--ink)}
.seg input:focus-visible+span{outline:3px solid var(--dacc); outline-offset:2px}
.sw input+span{width:38px; height:38px; padding:0; border-radius:50%; border:3px solid transparent}
.sw input:checked+span{border-color:var(--ink); background:inherit}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:14px}
input[type=date],input[type=email],input[type=tel],input[type=number],select{font:inherit; padding:11px 13px; border-radius:12px; border:2px solid var(--line); background:var(--card); color:var(--ink)}
input[type=date]:focus,input[type=email]:focus,input[type=tel]:focus,input[type=number]:focus,select:focus{outline:none; border-color:var(--sea)}
.okmsg{color:var(--sea); font-weight:800}
.okmsg:empty{display:none}
.countdown{display:flex; align-items:center; gap:14px}
.countdown b{font-family:var(--display); font-size:40px; line-height:1; color:var(--hue)}
.wrap{max-width:960px; margin:0 auto; padding-inline:16px; padding-block:24px 40px}
h1,h2,h3{font-family:var(--display); font-weight:700; line-height:1.12; text-wrap:balance; margin:0}
h1{font-size:clamp(28px,4.4vw,40px)} h2{font-size:24px} h3{font-size:19px; font-weight:600}
p{margin:0}
.muted{color:var(--soft)}
.stack{display:flex; flex-direction:column; gap:16px}
.row{display:flex; gap:12px; flex-wrap:wrap; align-items:center}
.pill{align-self:flex-start; font-size:12px; font-weight:900; letter-spacing:.08em; text-transform:uppercase; color:#fff; background:var(--hue,var(--coral)); padding:3px 12px; border-radius:30px}
/* tema scuro: i colori diventano chiari, quindi testo scuro sulle etichette */
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pill{color:#0F1E2E}}
:root[data-theme="dark"] .pill{color:#0F1E2E}
.head{display:flex; gap:16px; align-items:center}
.head .badge{width:64px; height:64px; flex:none}
.head h1,.head h2{color:var(--hue,var(--coral))}
.head .t{display:flex; flex-direction:column; gap:6px; min-width:0}
.squig{display:block; height:12px}
.note{font-family:var(--hand); font-size:26px; font-weight:700; line-height:1.1; color:var(--hue,var(--coral))}
.card{background:var(--card); border-radius:22px; padding:20px; box-shadow:var(--shadow); border-left:10px solid var(--hue,var(--sea))}
.card.plain{border-left:0}
.btn{font:inherit; font-weight:800; font-size:15px; border-radius:999px; padding:10px 18px; border:2px solid var(--ink); background:var(--ink); color:var(--paper); cursor:pointer; display:inline-flex; align-items:center; gap:8px}
.btn.ghost{background:transparent; color:var(--ink)}
.btn.sea{background:var(--sea); border-color:var(--sea); color:#fff}
.btn.coral{background:var(--coral); border-color:var(--coral); color:#fff}
.btn:disabled{opacity:.45; cursor:not-allowed}
.btn:focus-visible,.opt:focus-visible,.brand:focus-visible,.link:focus-visible{outline:3px solid var(--dacc); outline-offset:2px}
.link{background:none; border:0; padding:0; font:inherit; font-weight:800; color:var(--sea); cursor:pointer; text-decoration:underline; text-underline-offset:3px; align-self:flex-start}
.bar-p{height:10px; border-radius:99px; background:var(--line); overflow:hidden}
.bar-p i{display:block; height:100%; background:var(--hue,var(--sea)); border-radius:99px}
/* benvenuto: pannello blu come la copertina */
.hero{position:relative; overflow:hidden; background:var(--navy); color:#fff; border-radius:28px; padding:28px 28px 64px}
.hero .blobs{position:absolute; inset:0; width:100%; height:100%}
.hero .in{position:relative; display:grid; grid-template-columns:1.4fr 1fr; gap:24px; align-items:center}
.hero h1{color:#fff}
.hero .sub{color:var(--navy-soft); font-size:17px}
.hero .note{color:var(--dacc); font-size:30px}
.hero .waves{position:absolute; left:0; right:0; bottom:0; width:100%; height:56px}
.hero .art{width:100%; max-width:300px; height:auto; justify-self:center; filter:drop-shadow(0 10px 24px rgba(0,0,0,.35))}
.stats{display:grid; grid-template-columns:repeat(3,1fr); gap:14px}
.stat{border-radius:22px; padding:16px 18px; background:var(--tint)}
.stat b{display:block; font-family:var(--display); font-size:34px; font-weight:700; color:var(--hue); font-variant-numeric:tabular-nums; line-height:1.1}
.stat span{font-size:14px; color:var(--body); font-weight:800}
.lez{display:grid; grid-template-columns:auto 1fr auto; gap:18px; align-items:center}
.lez .num{position:relative; width:72px; height:72px; flex:none}
.lez .num svg{position:absolute; inset:0; width:100%; height:100%}
.lez .num b{position:relative; display:grid; place-items:center; width:100%; height:100%; font-family:var(--display); font-size:30px; font-weight:700; color:#fff}
.lez.fac{opacity:.78}
.lez.locked{opacity:.6; box-shadow:none; background:transparent; border:2px dashed var(--line); border-left-width:2px}
.chipbtn{border:0; font-family:inherit; cursor:pointer; text-decoration:underline; text-underline-offset:2px}
.chipbtn:hover{filter:brightness(.95)} .chipbtn:focus-visible{outline:3px solid var(--dacc); outline-offset:2px}
.chip{font-size:12px; font-weight:900; padding:3px 10px; border-radius:99px; background:var(--line); color:var(--soft); white-space:nowrap}
.chip.ok{background:var(--ok-t); color:var(--ok)} .chip.ko{background:var(--ko-t); color:var(--ko)} .chip.todo{background:var(--sun-t); color:var(--ink)} .chip.rev{background:var(--lilac-t); color:var(--purple)}
.cap{display:grid; grid-template-columns:auto 1fr auto; gap:14px; align-items:center; padding:14px 0; border-top:1px solid var(--line)}
.cap:first-child{border-top:0}
.cap .dot{width:40px; height:40px; border-radius:50%; background:var(--hue); color:#fff; display:grid; place-items:center; font-family:var(--display); font-weight:700; font-size:18px}
.viewer{background:var(--navy); border-radius:22px; overflow:hidden; box-shadow:var(--shadow)}
.viewer img{display:block; width:100%; aspect-ratio:16/9; object-fit:contain}
.viewer{position:relative; touch-action:pan-y}
.viewer .fsbtn{position:absolute; right:10px; bottom:10px; width:40px; height:40px; border-radius:12px; border:0; background:rgba(11,24,38,.72); color:#fff; display:grid; place-items:center; cursor:pointer}
.fsbtn svg,.fs .fsx svg{width:22px; height:22px}
/* schermo intero: solo la slide, si sfoglia toccando i lati o scorrendo */
.fs{position:fixed; inset:0; z-index:50; background:#0B1826; display:flex; align-items:center; justify-content:center; touch-action:pan-y; user-select:none; -webkit-user-select:none}
.fs img{width:100%; height:100%; object-fit:contain; display:block}
.fs .fsx{position:absolute; top:max(10px,env(safe-area-inset-top)); right:max(10px,env(safe-area-inset-right)); width:44px; height:44px; border-radius:50%; border:0; background:rgba(255,255,255,.16); color:#fff; display:grid; place-items:center; cursor:pointer}
.fs .fsc{position:absolute; top:max(14px,env(safe-area-inset-top)); left:max(14px,env(safe-area-inset-left)); font-family:var(--display); font-weight:700; color:#fff; background:rgba(228,87,46,.9); border-radius:20px; padding:1px 12px; font-size:14px; font-variant-numeric:tabular-nums; pointer-events:none}
.fs .fsh{position:absolute; top:50%; transform:translateY(-50%); width:36px; height:36px; border-radius:50%; background:rgba(255,255,255,.12); color:#fff; display:grid; place-items:center; font-size:20px; pointer-events:none}
/* telefono in orizzontale: lo schermo è basso, la slide si adatta all'altezza e la barra non resta fissa */
@media (orientation:landscape) and (max-height:520px){
  header.bar{position:relative}
  .slidebox{gap:6px!important}
  .viewer{display:flex; justify-content:center; border-radius:12px; align-self:center; max-width:100%}
  .viewer img{width:auto; max-width:100%; height:calc(100dvh - 62px)}
  .slidebox .vnav .btn{padding:6px 14px; font-size:14px}
}
.vnav{display:flex; align-items:center; gap:12px; justify-content:space-between; flex-wrap:wrap}
.counter{font-family:var(--display); font-weight:700; color:#fff; background:var(--coral); border-radius:20px; padding:2px 12px; font-variant-numeric:tabular-nums}
.q{display:flex; flex-direction:column; gap:10px; border-left-color:var(--coral)}
.q .qid{font-size:13px; font-weight:900; color:var(--coral)}
.q .txt{font-weight:800; font-size:18px}
.opt{display:flex; gap:12px; align-items:flex-start; text-align:left; width:100%; font:inherit; color:var(--ink); background:var(--card); border:2px solid var(--line); border-radius:14px; padding:12px 14px; cursor:pointer}
.opt .box{flex:none; width:24px; height:24px; border-radius:7px; border:2px solid var(--soft); margin-top:1px; display:grid; place-items:center}
.opt[aria-checked="true"]{border-color:var(--sea)} .opt[aria-checked="true"] .box{border-color:var(--sea); background:var(--sea)}
.opt[aria-checked="true"] .box::after,.opt.right .box::after{content:""; width:8px; height:13px; border:solid #fff; border-width:0 3px 3px 0; transform:rotate(45deg) translate(-1px,-1px)}
.opt.right{border-color:var(--ok); background:var(--ok-t); font-weight:800} .opt.right .box{background:var(--ok); border-color:var(--ok)}
.opt.wrong{border-color:var(--ko); background:var(--ko-t)} .opt.wrong .box{border-color:var(--ko); background:var(--ko)}
.opt.wrong .box::after{content:"\00d7"; color:#fff; font-weight:900; font-size:18px; line-height:1; border:0; transform:none; width:auto; height:auto}
.opt:disabled{cursor:default}
.fb{border-radius:14px; padding:12px 14px; font-weight:800; display:flex; flex-wrap:wrap; gap:8px 14px; align-items:center}
.fb.ok{background:var(--ok-t); color:var(--ok)} .fb.ko{background:var(--ko-t); color:var(--ko)}
.fb .link{color:inherit}
.result{display:flex; align-items:center; gap:16px; flex-wrap:wrap; justify-content:space-between}
.result .big{font-family:var(--display); font-size:40px; font-weight:700; color:var(--hue)}
table{border-collapse:collapse; width:100%; font-size:15px}
th,td{text-align:left; padding:10px; border-bottom:1px solid var(--line)}
th{font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--soft)}
td.num,th.num{text-align:right; font-variant-numeric:tabular-nums}
.tbl{overflow-x:auto}
/* scheda riassuntiva e appendici: in cima alla lezione e nei Materiali */
.xrow{display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:12px}
.xcard{display:flex; gap:12px; align-items:center; text-align:left; font:inherit; color:var(--ink); background:var(--card); border:2px solid var(--hue); border-radius:18px; padding:12px 14px; cursor:pointer; box-shadow:var(--shadow)}
.xcard:hover{transform:translateY(-1px)}
.xcard .xi{flex:none; width:46px; height:46px; border-radius:14px; background:var(--hue); color:#fff; display:grid; place-items:center; font-family:var(--display); font-size:22px}
.xcard .xi svg{width:30px; height:30px}
.xcard b{display:block; font-weight:800; line-height:1.25} .xcard small{display:block; color:var(--soft); font-weight:700; font-size:13px; line-height:1.35}
.xcard[disabled]{cursor:default; border-style:dashed; border-color:var(--line); box-shadow:none; background:transparent; transform:none} .xcard[disabled] .xi{background:var(--line); color:var(--soft)} .xcard[disabled] b{color:var(--soft)}
.errmsg{color:var(--coral); font-weight:800; margin:0}
.errmsg:empty{display:none}
.notice.net{background:var(--sea-t)}
.notice{background:var(--sun-t); border-radius:14px; padding:10px 14px; font-size:14px; font-weight:800}
label.fld{display:flex; flex-direction:column; gap:6px; font-weight:800}
input[type=text]{font:inherit; padding:11px 13px; border-radius:12px; border:2px solid var(--line); background:var(--card); color:var(--ink)}
input[type=text]:focus{outline:none; border-color:var(--sea)}
.check{display:flex; gap:10px; align-items:flex-start; font-size:14px}
.check input{margin-top:3px; width:20px; height:20px; accent-color:var(--sea); flex:none}
footer.foot{max-width:960px; margin:0 auto; padding:8px 16px 28px; display:flex; gap:10px; align-items:center; color:var(--soft); font-size:13px; font-weight:700}
footer.foot svg{width:28px; height:28px; flex:none; align-self:flex-start}
footer.foot .legal{display:block; margin-top:4px; font-size:11.5px; font-weight:600; line-height:1.45; opacity:.85}
@media (max-width:640px){
  .hero .in{grid-template-columns:1fr} .hero .art{max-width:200px}
  .stats{gap:8px} .stat{padding:12px} .stat b{font-size:24px} .stat span{font-size:12px}
  .lez{grid-template-columns:auto 1fr} .lez .go{grid-column:1/-1}
  .cap{grid-template-columns:auto 1fr} .cap .acts{grid-column:1/-1; justify-content:flex-start!important}
  .head .badge{width:52px; height:52px} .brand i{display:none}
  header.bar .in{gap:8px} .brand{gap:8px} .brand svg{width:38px; height:38px} .brand b{font-size:16px}
  .navb{padding:6px 9px; font-size:13px} .who .wn{display:none} .grid2{grid-template-columns:1fr}
}
@media (max-width:520px){
  .navb span{display:none} .navb{padding:7px 9px} .brand b{font-size:15px}
}
@media (max-width:420px){
  .brand > span:last-child{display:none} header.bar .in{gap:6px} .nav{gap:4px}
  .tbl{padding:12px 8px} .tbl table{font-size:13px} .tbl th,.tbl td{padding:8px 4px; white-space:nowrap} .tbl th{letter-spacing:0; font-size:11px} .tbl .lt{display:none} .tbl .sh{display:inline}
}
@media (prefers-reduced-motion: no-preference){.opt,.btn{transition:background .15s, border-color .15s, transform .15s} .btn:active{transform:scale(.97)}}
</style>

<div class="backdrop" id="backdrop" aria-hidden="true"></div>
<header class="bar"><div class="in">
  <button class="brand" id="home-btn" aria-label="Torna alla home">
    <span id="logo-h"></span>

function blob(cx,cy,r,seed=0,k=.18,n=7){const p=[];for(let i=0;i<n;i++){const a=2*Math.PI*i/n,rr=r*(1+k*Math.sin(3*a+seed)+.5*k*Math.cos(5*a+seed*1.7));p.push([cx+rr*Math.cos(a),cy+rr*Math.sin(a)]);}
  let d=`M${((p[0][0]+p[1][0])/2).toFixed(1)} ${((p[0][1]+p[1][1])/2).toFixed(1)} `;for(let i=0;i<n;i++){const a=p[(i+1)%n],b=p[(i+2)%n];d+=`Q${a[0].toFixed(1)} ${a[1].toFixed(1)} ${((a[0]+b[0])/2).toFixed(1)} ${((a[1]+b[1])/2).toFixed(1)} `;}return d+'Z';}
function wave(y,amp,per,x0,x1,h){let d=`M${x0} ${y} `;for(let x=x0;x<x1;x+=per)d+=`q${per/4} ${-amp} ${per/2} 0 t${per/2} 0 `;return d+`L${x1} ${h} L${x0} ${h} Z`;}

const squiggle=(hue,w=150)=>{const s=svgEl(`<path d="M5 9 ${Array(Math.floor(w/44)).fill('q11 -10 22 0 t22 0').join(' ')}" fill="none" stroke="${hue}" stroke-width="7" stroke-linecap="round"/>`,'squig',`0 0 ${w} 18`);s.style.width=w*.8+'px';return s;};

/* ---------- archivio: server dell'aula, db personale dell'artifact, oppure questo dispositivo ---------- */
const TOKEN_KEY='corso-aula-token';
const tok={get(){try{return localStorage.getItem(TOKEN_KEY)}catch(e){return null}}, set(v){try{v?localStorage.setItem(TOKEN_KEY,v):localStorage.removeItem(TOKEN_KEY)}catch(e){}}};
async function api(path,body,keepalive){
  const r=await fetch('api/'+path,{method:body===undefined?'GET':'POST',keepalive:!!keepalive,headers:{'Content-Type':'application/json','X-Token':tok.get()||''},body:body===undefined?undefined:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));
  if(!r.ok) throw Object.assign(new Error(j.errore||('errore '+r.status)),{status:r.status,dati:j});
  return j;
}
let giro=0; // cambia quando l'istruttore azzera i progressi di questo allievo
// in aula: copia di sicurezza sul telefono, per lavorare anche quando il server non risponde;
// al ritorno della rete si unisce ai dati del server (vince la risposta più recente, le slide viste si sommano)
const COPIA='corso-aula-copia';
const copia={
  leggi(){ try{ const c=JSON.parse(localStorage.getItem(COPIA)||'null'); return c&&c.token===tok.get()?c:null; }catch(e){ return null; } },
  scrivi(pendente){ try{ localStorage.setItem(COPIA,JSON.stringify({token:tok.get(),giro,pendente,ts:Date.now(),att:ATT?[...ATT]:null,S})); }catch(e){} },
  togli(){ try{ localStorage.removeItem(COPIA); }catch(e){} }
};
function unisci(server,loc){
  const out=Object.assign(blank(),server);
  for(const [L,pp] of Object.entries(loc.visti||{})) out.visti[L]=[...new Set([...(out.visti[L]||[]),...pp])].sort((a,b)=>a-b);
  for(const [q,r] of Object.entries(loc.risposte||{})){ const v=out.risposte[q];
    if(!v||String(r.ts)>String(v.ts)) out.risposte[q]={...r,tentativi:Math.max(r.tentativi||1,v?v.tentativi||1:0)}; }
  for(const [d,g] of Object.entries(loc.diario||{})){ const v=out.diario[d]||{q:0,s:0}; out.diario[d]={q:Math.max(v.q,g.q||0),s:Math.max(v.s,g.s||0)}; }
  out.profilo=Object.assign({},server.profilo||{},loc.profilo||{});
  return out;
}
// online, primo accesso con l'email: i progressi fatti su questo telefono con la versione precedente (senza server)
// diventano quelli dell'account; altrimenti si chiede il nome
async function primoOnline(){
  let loc=null; try{ loc=JSON.parse(localStorage.getItem(KEY)||'null'); }catch(e){}
  if(!loc||!loc.nome) return blank();
  const j=await api('accedi',{nome:loc.nome}); tok.set(j.token); giro=j.giro||0;
  const st=Object.assign(unisci(Object.assign(blank(),j.stato),Object.assign(blank(),loc)),{nome:j.nome,consenso:true,creato:loc.creato||null});
  setTimeout(()=>{ store.save(); try{ localStorage.removeItem(KEY); }catch(e){} },300);
  return conProfilo(st);
}
const store={
  async load(){
    try{
      const info=await api('info');
      if(info.aula){
        mode='aula'; aula=info; if(info.attive) ATT=new Set(info.attive);
        if(tok.get()||info.online){
          try{ const j=await api('progresso'); if(info.online) tok.set('online'); const dalServer=Object.assign(blank(),j.stato,{nome:j.nome,consenso:true,creato:j.creato||null});
            const c=copia.leggi(); let st=dalServer;
            // lavoro fatto senza rete (e non azzerato nel frattempo dall'istruttore): si unisce e si invia
            if(c&&c.pendente&&(c.giro||0)===(j.giro||0)){ st=Object.assign(unisci(dalServer,c.S),{nome:j.nome,consenso:true,creato:j.creato||null}); setTimeout(()=>store.save(),300); }
            giro=j.giro||0; return conProfilo(st); }
          catch(e){ if(e.status===401){ tok.set(null); if(info.online) return await primoOnline(); } else throw e; }
        }
        return blank();
      }
    }catch(e){
      // server dell'aula non raggiungibile: se su questo telefono c'è la copia, si continua con quella
      const c=tok.get()&&copia.leggi();
      if(mode==='aula'||c){ mode='aula'; offline=true; if(c&&c.att) ATT=new Set(c.att); giro=c?c.giro||0:giro;
        return c?conProfilo(Object.assign(blank(),c.S)):blank(); } }
    try{
      if(C&&(C.demo||C.casa)) throw 0;   // demo e app da casa: niente archivio online, i progressi restano sul dispositivo
      const user=await claude.use('user');
      if(user){ me=await user.me(); uid=me.id; }
      db=await claude.use('db');
      if(db && uid){
        const snap=await db.doc('data/users/'+uid+'/profile').get();
        mode='cloud';
        return snap.exists ? Object.assign(blank(),snap.data()) : blank();
      }
    }catch(e){ console.warn('db non disponibile',e); }
    mode='local';
    try{ const raw=localStorage.getItem(KEY); if(raw) return Object.assign(blank(),JSON.parse(raw)); }catch(e){}
    return blank();
  },
  t:null,
  save(){
    clearTimeout(this.t);
    this.t=setTimeout(async()=>{
      const body=JSON.parse(JSON.stringify(S));
      if(mode==='aula'){
        copia.scrivi(true);
        try{ await api('progresso',{visti:body.visti,risposte:body.risposte,profilo:body.profilo,diario:body.diario,giro}); offline=false; copia.scrivi(false); }
        catch(e){
          if(e.status===409){ giro=e.dati.giro||0; S=Object.assign(blank(),e.dati.stato,{nome:S.nome,consenso:true}); offline=false; copia.scrivi(false); go(vHome); return; }
          if(e.status===401){ copia.togli(); tok.set(null); S=blank(); renderWho(); go(vRegistrazione); return; } offline=true; console.warn('server dell’aula non raggiungibile',e); }

      }

  },

    if(this.t){ clearTimeout(this.t); this.t=null; try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} if(mode==='cloud'){ db.doc('data/users/'+uid+'/profile').set(JSON.parse(JSON.stringify(S))).catch(()=>{}); } } }
};

},30000);

/* ---------- utilità ---------- */
const el=(tag,attrs={},...kids)=>{const n=document.createElement(tag);for(const[k,v] of Object.entries(attrs)){if(k==='class')n.className=v;else if(k==='style')n.setAttribute('style',v);else if(k.startsWith('on'))n.addEventListener(k.slice(2),v);else if(v!==false&&v!=null)n.setAttribute(k,v===true?'':v);}for(const k of kids.flat()){if(k==null||k===false)continue;n.append(k.nodeType?k:document.createTextNode(String(k)));}return n;};
const lez=id=>C.lezioni.find(l=>l.id===id);

    el('div',{class:'row'},el('a',{class:'btn ghost',href:'docente.html'},'Guarda l’area istruttore di esempio →'),
      S&&S.nome?el('button',{class:'btn ghost',onclick:()=>{ try{ localStorage.removeItem(KEY); }catch(e){} location.reload(); }},'Ricomincia la demo'):null));
}

const lidx=id=>C.lezioni.findIndex(l=>l.id===id);

/* ---------- profilo, diario di studio, preferenze ---------- */

function conProfilo(st){ st.profilo=st.profilo||{}; st.diario=st.diario||{};
  if(!st.profilo.nome&&st.nome){ const parti=st.nome.trim().split(/\s+/); st.profilo.nome=parti.shift(); if(parti.length) st.profilo.cognome=parti.join(' '); }

const oggi=(d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function segna(k,n){ const d=oggi(), g=S.diario[d]||(S.diario[d]={q:0,s:0}); g[k]+=n; }

function settimana(){ const t=new Date(); t.setHours(0,0,0,0); const lun=new Date(t); lun.setDate(t.getDate()-((t.getDay()+6)%7));
  let q=0,s=0,giorni=0; for(const d=new Date(lun); d<=t; d.setDate(d.getDate()+1)){ const g=S.diario[oggi(d)]; if(g&&(g.q||g.s)){ q+=g.q; s+=g.s; giorni++; } }
  return {q,s,giorni}; }
function giorniEsame(){ const e=P().esame; if(!e) return null; const [y,m,d]=e.split('-').map(Number); const t=new Date(); t.setHours(0,0,0,0);

/* ---------- studio a casa: passaggio dei dati tra app dell'aula e app da casa ----------
   L'app da casa (https, installabile, offline) e quella dell'aula (http sul PC dell'istruttore) non possono
   parlarsi direttamente: i progressi viaggiano nel link che apre l'altra app (#da-aula=… / #da-casa=…). */
let avvisoCasa=null;
const AULA_KEY='corso-casa-aula';
async function impacchetta(o){
  const testo=JSON.stringify(o), b=new TextEncoder().encode(testo);
  const b64=x=>btoa(String.fromCharCode(...new Uint8Array(x))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  if(window.CompressionStream){ try{ const z=await new Response(new Blob([b]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer(); return 'z.'+b64(z); }catch(e){} }
  return 'j.'+b64(b);
}
async function spacchetta(t){
  const [k,d]=[t.slice(0,2),t.slice(2)], bin=Uint8Array.from(atob(d.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));
  const dati=k==='z.'?await new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer():bin;
  return JSON.parse(new TextDecoder().decode(dati));
}
const daHash=chiave=>{ const m=location.hash.match(new RegExp('[#&]'+chiave+'=([^&]+)')); return m?m[1]:null; };
const pulisciHash=()=>history.replaceState(null,'',location.pathname+location.search);
const progressi=()=>({visti:S.visti,risposte:S.risposte,profilo:S.profilo,diario:S.diario});
// quante cose nuove porta l'altra app
function novita(prima,dopo){ let q=0,sl=0;
  for(const [k,r] of Object.entries(dopo.risposte||{})){ const v=prima.risposte[k]; if(!v||String(r.ts)>String(v.ts)) q++; }
  for(const [L,pp] of Object.entries(dopo.visti||{})) sl+=pp.filter(x=>!(prima.visti[L]||[]).includes(x)).length;
  return {q,sl}; }
function riceviDati(pacco,da){
  const n=novita(S,pacco.S), nome=S.nome;
  S=conProfilo(Object.assign(unisci(S,pacco.S),{nome:nome||pacco.nome,consenso:true}));
  store.save(); renderWho();
  avvisoCasa=(da==='casa'?'Arrivati da casa: ':'Arrivati dall’aula: ')+n.q+(n.q===1?' quiz':' quiz')+' e '+n.sl+(n.sl===1?' slide':' slide')+'.';
}
// in aula: «Porta a casa» apre l'app da casa con i progressi
async function portaACasa(){ store.flush();
  const t=await impacchetta({v:1,nome:S.nome,aula:location.origin,S:progressi()});
  location.href=aula.casa.replace(/#.*$/,'')+'#da-aula='+t; }
// a casa: «Invia all'aula» apre l'app dell'aula, che unisce e salva sul server
async function inviaAllAula(){ const a=leggiAula(); if(!a) return;
  const t=await impacchetta({v:1,nome:S.nome,S:progressi()});

/* ---------- app da casa con accesso riservato (Cloudflare Access) ----------
   Il sito è protetto: si entra con l'email ammessa e un codice. A ogni apertura con la rete l'app chiede
   C.accesso senza passare dalla copia conservata: se l'accesso non c'è più, toglie slide e quiz dal
   telefono e chiede di rientrare con l'email. Senza rete funziona, ma solo per GIORNI_OFFLINE giorni
   dall'ultima verifica riuscita. I progressi restano sul telefono (non sono contenuti del corso). */
const VERIFICA_KEY='corso-casa-verifica', GIORNI_OFFLINE=7;
let regSW=null;
const registraSW=()=>{ if(!regSW&&'serviceWorker' in navigator) regSW=navigator.serviceWorker.register('sw.js').catch(()=>null); };
async function esitoAccesso(){
  const ac=new AbortController(), t=setTimeout(()=>ac.abort(),8000);
  try{ const r=await fetch(C.accesso+'?t='+Date.now(),{cache:'no-store',redirect:'manual',signal:ac.signal});
    if(r.type==='opaqueredirect'||r.status===401||r.status===403) return 'no';   // rimanda al login: sessione scaduta o email tolta
    if(!r.ok) return 'rete';
    try{ const j=await r.json(); return j&&j.ok?'si':'no'; }catch(e){ return 'no'; } }
  catch(e){ return 'rete'; }
  finally{ clearTimeout(t); }
}

async function togliContenuti(){
  try{ localStorage.removeItem(VERIFICA_KEY); }catch(e){}
  try{ if(regSW) await regSW; for(const r of await navigator.serviceWorker.getRegistrations()) await r.unregister(); }catch(e){}
  try{ for(const k of await caches.keys()) if(k.startsWith('corso-casa-')) await caches.delete(k); }catch(e){}
}
function accessoNegato(){
  blocco('Accesso da rinnovare',['Per continuare entra di nuovo con la tua email: ti arriva un codice da inserire.',
    'Se il codice non arriva, il tuo accesso non è più attivo: rivolgiti all’istruttore.'],'Entra con la tua email',()=>{ location.href='entra/'; });

// online: le slide, le schede e le appendici delle lezioni aperte si scaricano subito, così ci sono anche senza rete
let precaricando=false;
async function precarica(){
  if(!C.online||precaricando||!('caches' in window)||!('serviceWorker' in navigator)||!navigator.onLine) return;
  precaricando=true;
  try{
    if(!navigator.serviceWorker.controller) await new Promise(r=>{ navigator.serviceWorker.addEventListener('controllerchange',r,{once:true}); setTimeout(r,8000); });
    if(!navigator.serviceWorker.controller) return;
    const u=[];
    for(const l of aperte()){ for(const p of allPages(l.id)) u.push(img(l.id,p)); for(const p of l.scheda||[]) u.push(img('SR',p)); }
    for(const p of C.schede.generali||[]) u.push(img('SR',p));
    for(const a of C.appendici) if(appAperta(a)) u.push(a.file);
    for(const x of u){ if(await caches.match(x,{ignoreSearch:true})) continue; try{ await fetch(x); }catch(e){ return; } }
  } finally{ precaricando=false; }
}
// true: si può usare l'app (se la verifica è recente, l'app parte subito e il controllo continua in sottofondo)
async function controllaAccesso(){
  if(!C.casa||!C.accesso){ if(C.casa) registraSW(); return true; }
  let ultima=0; try{ ultima=+(localStorage.getItem(VERIFICA_KEY)||0); }catch(e){}
  const recente=Date.now()-ultima<GIORNI_OFFLINE*864e5;
  if(recente) registraSW(); else $app.replaceChildren(el('p',{class:'muted',style:'padding:24px'},'Controllo l’accesso…'));
  const verifica=esitoAccesso().then(e=>{
    if(e==='si'){ try{ localStorage.setItem(VERIFICA_KEY,String(Date.now())); }catch(x){} registraSW(); return true; }
    if(e==='no'){ accessoNegato(); return false; }
    if(!recente){ blocco('Collegati a internet',['Per sicurezza l’app va verificata con la rete almeno una volta ogni '+GIORNI_OFFLINE+' giorni.',
      'Accendi i dati o il wifi e riprova: ci vuole un attimo.'],'Riprova',()=>location.reload()); return false; }
    return true; });
  return recente?true:verifica;
}
