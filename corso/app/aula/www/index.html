<!doctype html>
<html lang="it">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Corso Patente Nautica</title>
<meta charset="utf-8">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Layout: come le slide del corso. Barra blu notte con il logo, fondo carta con macchie colorate e onde,
   titoli con badge a macchia + etichetta colorata, schede bianche con il bordo colorato a sinistra. */
:root{
  --paper:#FFF8EE; --card:#FFFFFF; --ink:#1B2A41; --body:#34465E; --soft:#5E6E82; --line:#EDE5D6;
  --navy:#16324F; --navy-2:#1F4466; --navy-ink:#FFFFFF; --navy-soft:#C9D6E3; --dacc:#FFC145;
  --coral:#E4572E; --sea:#0B8A99; --sun:#F4A300; --green:#2E9E5B; --blue:#2F6FDB; --purple:#7B5CD6;
  --coral-t:#FFE3D9; --sea-t:#D5F3F5; --sun-t:#FFF0C9; --green-t:#DFF3E4; --blue-t:#E1EAFD; --lilac-t:#ECE6FB;
  --ok:#0B8A99; --ok-t:#D5F3F5; --ko:#C8402A; --ko-t:#FFE3D9; --shadow:0 8px 24px rgba(27,42,65,.10);
  --display:'Fredoka','Trebuchet MS',sans-serif; --text:'Nunito Sans',Arial,sans-serif; --hand:'Caveat','Brush Script MT',cursive;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0F1E2E; --card:#16293D; --ink:#EEF3F8; --body:#D3DEE9; --soft:#A7B6C6; --line:#25405A;
  --navy:#0B1826; --navy-2:#173350; --coral-t:#3D2219; --sea-t:#123B47; --sun-t:#3A3017; --green-t:#163626; --blue-t:#1B2B4A; --lilac-t:#2A2547;
  --coral:#FF7A55; --sea:#3CC3D2; --sun:#FFC145; --green:#4FC98A; --blue:#7FA8FF; --purple:#A891FF;
  --ok:#3CC3D2; --ok-t:#123B47; --ko:#FF7A62; --ko-t:#3E1E19; --shadow:0 8px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0F1E2E; --card:#16293D; --ink:#EEF3F8; --body:#D3DEE9; --soft:#A7B6C6; --line:#25405A;
  --navy:#0B1826; --navy-2:#173350; --coral-t:#3D2219; --sea-t:#123B47; --sun-t:#3A3017; --green-t:#163626; --blue-t:#1B2B4A; --lilac-t:#2A2547;
  --coral:#FF7A55; --sea:#3CC3D2; --sun:#FFC145; --green:#4FC98A; --blue:#7FA8FF; --purple:#A891FF;
  --ok:#3CC3D2; --ok-t:#123B47; --ko:#FF7A62; --ko-t:#3E1E19; --shadow:0 8px 24px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--paper)}
body{margin:0; color:var(--ink); font-family:var(--text); font-size:16px; line-height:1.5; min-height:100%}
.backdrop{position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden}
.backdrop svg{position:absolute}
header.bar,main,footer.foot{position:relative; z-index:1}
header.bar{position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--navy); color:var(--navy-ink)}
header.bar .in{max-width:960px; margin:0 auto; padding:10px 16px 6px; display:flex; align-items:center; gap:12px}
header.bar .waves{display:block; width:100%; height:14px}
.brand{display:flex; align-items:center; gap:12px; cursor:pointer; background:none; border:0; color:inherit; padding:0; font:inherit; text-align:left}
.brand svg{width:44px; height:44px; flex:none}
.brand b{display:block; font-family:var(--display); font-size:20px; font-weight:700; line-height:1.1}
.brand i{display:block; font-family:var(--hand); font-style:normal; font-size:20px; line-height:1; color:var(--dacc)}
.spacer{flex:1}
.nav{display:flex; gap:6px}
.nav[hidden]{display:none}
.navb{font:inherit; font-weight:800; font-size:14px; display:inline-flex; align-items:center; gap:6px; padding:7px 13px; border-radius:999px; border:2px solid rgba(255,248,238,.35); background:transparent; color:var(--navy-ink); cursor:pointer}
.navb svg{width:18px; height:18px}
.navb:hover{border-color:var(--dacc)}
.navb[aria-current="page"]{background:var(--dacc); border-color:var(--dacc); color:#16324F}
.navb:focus-visible{outline:3px solid var(--dacc); outline-offset:2px}
.tbl .sh{display:none}
.reset{display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between}
.who{display:flex; align-items:center; gap:8px; font-weight:800; font-size:14px; color:var(--navy-soft)}
.who img{width:30px; height:30px; border-radius:50%; border:2px solid var(--dacc)}
.wrap{max-width:960px; margin:0 auto; padding-inline:16px; padding-block:24px 40px}
h1,h2,h3{font-family:var(--display); font-weight:700; line-height:1.12; text-wrap:balance; margin:0}
h1{font-size:clamp(28px,4.4vw,40px)} h2{font-size:24px} h3{font-size:19px; font-weight:600}
p{margin:0}
.muted{color:var(--soft)}
.stack{display:flex; flex-direction:column; gap:16px}
.row{display:flex; gap:12px; flex-wrap:wrap; align-items:center}
.pill{align-self:flex-start; font-size:12px; font-weight:900; letter-spacing:.08em; text-transform:uppercase; color:#fff; background:var(--hue,var(--coral)); padding:3px 12px; border-radius:30px}
/* tema scuro: i colori diventano chiari, quindi testo scuro sulle etichette */
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pill{color:#0F1E2E}}
:root[data-theme="dark"] .pill{color:#0F1E2E}
.head{display:flex; gap:16px; align-items:center}
.head .badge{width:64px; height:64px; flex:none}
.head h1,.head h2{color:var(--hue,var(--coral))}
.head .t{display:flex; flex-direction:column; gap:6px; min-width:0}
.squig{display:block; height:12px}
.note{font-family:var(--hand); font-size:26px; font-weight:700; line-height:1.1; color:var(--hue,var(--coral))}
.card{background:var(--card); border-radius:22px; padding:20px; box-shadow:var(--shadow); border-left:10px solid var(--hue,var(--sea))}
.card.plain{border-left:0}
.btn{font:inherit; font-weight:800; font-size:15px; border-radius:999px; padding:10px 18px; border:2px solid var(--ink); background:var(--ink); color:var(--paper); cursor:pointer; display:inline-flex; align-items:center; gap:8px}
.btn.ghost{background:transparent; color:var(--ink)}
.btn.sea{background:var(--sea); border-color:var(--sea); color:#fff}
.btn.coral{background:var(--coral); border-color:var(--coral); color:#fff}
.btn:disabled{opacity:.45; cursor:not-allowed}
.btn:focus-visible,.opt:focus-visible,.brand:focus-visible,.link:focus-visible{outline:3px solid var(--dacc); outline-offset:2px}
.link{background:none; border:0; padding:0; font:inherit; font-weight:800; color:var(--sea); cursor:pointer; text-decoration:underline; text-underline-offset:3px; align-self:flex-start}
.bar-p{height:10px; border-radius:99px; background:var(--line); overflow:hidden}
.bar-p i{display:block; height:100%; background:var(--hue,var(--sea)); border-radius:99px}
/* benvenuto: pannello blu come la copertina */
.hero{position:relative; overflow:hidden; background:var(--navy); color:#fff; border-radius:28px; padding:28px 28px 64px}
.hero .blobs{position:absolute; inset:0; width:100%; height:100%}
.hero .in{position:relative; display:grid; grid-template-columns:1.4fr 1fr; gap:24px; align-items:center}
.hero h1{color:#fff}
.hero .sub{color:var(--navy-soft); font-size:17px}
.hero .note{color:var(--dacc); font-size:30px}
.hero .waves{position:absolute; left:0; right:0; bottom:0; width:100%; height:56px}
.hero .art{width:100%; max-width:300px; justify-self:center}
.stats{display:grid; grid-template-columns:repeat(3,1fr); gap:14px}
.stat{border-radius:22px; padding:16px 18px; background:var(--tint)}
.stat b{display:block; font-family:var(--display); font-size:34px; font-weight:700; color:var(--hue); font-variant-numeric:tabular-nums; line-height:1.1}
.stat span{font-size:14px; color:var(--body); font-weight:800}
.lez{display:grid; grid-template-columns:auto 1fr auto; gap:18px; align-items:center}
.lez .num{position:relative; width:72px; height:72px; flex:none}
.lez .num svg{position:absolute; inset:0; width:100%; height:100%}
.lez .num b{position:relative; display:grid; place-items:center; width:100%; height:100%; font-family:var(--display); font-size:30px; font-weight:700; color:#fff}
.lez.locked{opacity:.6; box-shadow:none; background:transparent; border:2px dashed var(--line); border-left-width:2px}
.chip{font-size:12px; font-weight:900; padding:3px 10px; border-radius:99px; background:var(--line); color:var(--soft); white-space:nowrap}
.chip.ok{background:var(--ok-t); color:var(--ok)} .chip.ko{background:var(--ko-t); color:var(--ko)} .chip.todo{background:var(--sun-t); color:var(--ink)} .chip.rev{background:var(--lilac-t); color:var(--purple)}
.cap{display:grid; grid-template-columns:auto 1fr auto; gap:14px; align-items:center; padding:14px 0; border-top:1px solid var(--line)}
.cap:first-child{border-top:0}
.cap .dot{width:40px; height:40px; border-radius:50%; background:var(--hue); color:#fff; display:grid; place-items:center; font-family:var(--display); font-weight:700; font-size:18px}
.viewer{background:var(--navy); border-radius:22px; overflow:hidden; box-shadow:var(--shadow)}
.viewer img{display:block; width:100%; aspect-ratio:16/9; object-fit:contain}
.viewer{position:relative; touch-action:pan-y}
/* telefono in orizzontale: lo schermo è basso, la slide si adatta all'altezza e la barra non resta fissa */
@media (orientation:landscape) and (max-height:520px){
  header.bar{position:relative}
  .slidebox{gap:6px!important}
  .viewer{display:flex; justify-content:center; border-radius:12px; align-self:center; max-width:100%}
  .viewer img{width:auto; max-width:100%; height:calc(100dvh - 62px)}
  .slidebox .vnav .btn{padding:6px 14px; font-size:14px}
}
.vnav{display:flex; align-items:center; gap:12px; justify-content:space-between; flex-wrap:wrap}
.counter{font-family:var(--display); font-weight:700; color:#fff; background:var(--coral); border-radius:20px; padding:2px 12px; font-variant-numeric:tabular-nums}
.q{display:flex; flex-direction:column; gap:10px; border-left-color:var(--coral)}
.q .qid{font-size:13px; font-weight:900; color:var(--coral)}
.q .txt{font-weight:800; font-size:18px}
.opt{display:flex; gap:12px; align-items:flex-start; text-align:left; width:100%; font:inherit; color:var(--ink); background:var(--card); border:2px solid var(--line); border-radius:14px; padding:12px 14px; cursor:pointer}
.opt .box{flex:none; width:24px; height:24px; border-radius:7px; border:2px solid var(--soft); margin-top:1px; display:grid; place-items:center}
.opt[aria-checked="true"]{border-color:var(--sea)} .opt[aria-checked="true"] .box{border-color:var(--sea); background:var(--sea)}
.opt[aria-checked="true"] .box::after,.opt.right .box::after{content:""; width:8px; height:13px; border:solid #fff; border-width:0 3px 3px 0; transform:rotate(45deg) translate(-1px,-1px)}
.opt.right{border-color:var(--ok); background:var(--ok-t); font-weight:800} .opt.right .box{background:var(--ok); border-color:var(--ok)}
.opt.wrong{border-color:var(--ko); background:var(--ko-t)} .opt.wrong .box{border-color:var(--ko); background:var(--ko)}
.opt.wrong .box::after{content:"\00d7"; color:#fff; font-weight:900; font-size:18px; line-height:1; border:0; transform:none; width:auto; height:auto}
.opt:disabled{cursor:default}
.fb{border-radius:14px; padding:12px 14px; font-weight:800; display:flex; flex-wrap:wrap; gap:8px 14px; align-items:center}
.fb.ok{background:var(--ok-t); color:var(--ok)} .fb.ko{background:var(--ko-t); color:var(--ko)}
.fb .link{color:inherit}
.result{display:flex; align-items:center; gap:16px; flex-wrap:wrap; justify-content:space-between}
.result .big{font-family:var(--display); font-size:40px; font-weight:700; color:var(--hue)}
table{border-collapse:collapse; width:100%; font-size:15px}
th,td{text-align:left; padding:10px; border-bottom:1px solid var(--line)}
th{font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--soft)}
td.num,th.num{text-align:right; font-variant-numeric:tabular-nums}
.tbl{overflow-x:auto}
.errmsg{color:var(--coral); font-weight:800; margin:0}
.errmsg:empty{display:none}
.notice.net{background:var(--sea-t)}
.notice{background:var(--sun-t); border-radius:14px; padding:10px 14px; font-size:14px; font-weight:800}
label.fld{display:flex; flex-direction:column; gap:6px; font-weight:800}
input[type=text]{font:inherit; padding:11px 13px; border-radius:12px; border:2px solid var(--line); background:var(--card); color:var(--ink)}
input[type=text]:focus{outline:none; border-color:var(--sea)}
.check{display:flex; gap:10px; align-items:flex-start; font-size:14px}
.check input{margin-top:3px; width:20px; height:20px; accent-color:var(--sea); flex:none}
footer.foot{max-width:960px; margin:0 auto; padding:8px 16px 28px; display:flex; gap:10px; align-items:center; color:var(--soft); font-size:13px; font-weight:700}
footer.foot svg{width:28px; height:28px; flex:none}
@media (max-width:640px){
  .hero .in{grid-template-columns:1fr} .hero .art{max-width:200px}
  .stats{gap:8px} .stat{padding:12px} .stat b{font-size:24px} .stat span{font-size:12px}
  .lez{grid-template-columns:auto 1fr} .lez .go{grid-column:1/-1}
  .cap{grid-template-columns:auto 1fr} .cap .acts{grid-column:1/-1; justify-content:flex-start!important}
  .head .badge{width:52px; height:52px} .brand i{display:none}
  header.bar .in{gap:8px} .brand{gap:8px} .brand svg{width:38px; height:38px} .brand b{font-size:16px}
  .navb{padding:6px 9px; font-size:13px} .who span{display:none}
  .tbl{padding:12px 8px} .tbl table{font-size:13px} .tbl th,.tbl td{padding:8px 4px; white-space:nowrap} .tbl th{letter-spacing:0; font-size:11px} .tbl .lt{display:none} .tbl .sh{display:inline}
}
@media (prefers-reduced-motion: no-preference){.opt,.btn{transition:background .15s, border-color .15s, transform .15s} .btn:active{transform:scale(.97)}}
</style>

<div class="backdrop" id="backdrop" aria-hidden="true"></div>
<header class="bar"><div class="in">
  <button class="brand" id="home-btn" aria-label="Torna alla home">
    <span id="logo-h"></span>
    <span><b>Corso Patente Nautica</b><i>il mare, a vele spiegate</i></span>
  </button>
  <span class="spacer"></span>
  <nav class="nav" id="nav" hidden>
    <button class="navb" id="nav-home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11 L12 3 L21 11 M5 9.5 V21 H10 V15 H14 V21 H19 V9.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Home</span></button>
    <button class="navb" id="nav-prog"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 21 H21 M6 17 V12 M11 17 V6 M16 17 V9" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg><span>Progressi</span></button>
  </nav>
  <span class="who" id="who"></span>
</div><svg class="waves" viewBox="0 0 960 14" preserveAspectRatio="none" aria-hidden="true"><path id="wv-h" fill="#12A4B5" fill-opacity=".45"/></svg></header>

<main class="wrap" id="app">
  <div class="stack" style="padding-block:24px">
    <span class="pill">Caricamento</span>
    <h1>Preparo le lezioni 1 e 2…</h1>
  </div>
</main>
<footer class="foot"><span id="logo-f"></span><span>Fabrizio Fiorucci · Patente nautica Vela/Motore entro le 12 miglia e senza limiti dalla costa</span></footer>

<script>
(function(){
const $app=document.getElementById('app'), $who=document.getElementById('who');
let C=null, S=null, uid=null, me=null, db=null, mode='local', aula=null, offline=false;
const KEY='corso-nautico-v1';
const blank=()=>({nome:'',consenso:false,creato:null,visti:{},risposte:{}});
const HUES=['var(--coral)','var(--sea)','var(--purple)','var(--blue)','var(--green)'];
const TINTS=['var(--coral-t)','var(--sea-t)','var(--lilac-t)','var(--blue-t)','var(--green-t)'];

/* ---------- grafica delle slide: macchie, onde, linea ondulata, logo, icone ---------- */
function blob(cx,cy,r,seed=0,k=.18,n=7){const p=[];for(let i=0;i<n;i++){const a=2*Math.PI*i/n,rr=r*(1+k*Math.sin(3*a+seed)+.5*k*Math.cos(5*a+seed*1.7));p.push([cx+rr*Math.cos(a),cy+rr*Math.sin(a)]);}
  let d=`M${((p[0][0]+p[1][0])/2).toFixed(1)} ${((p[0][1]+p[1][1])/2).toFixed(1)} `;for(let i=0;i<n;i++){const a=p[(i+1)%n],b=p[(i+2)%n];d+=`Q${a[0].toFixed(1)} ${a[1].toFixed(1)} ${((a[0]+b[0])/2).toFixed(1)} ${((a[1]+b[1])/2).toFixed(1)} `;}return d+'Z';}
function wave(y,amp,per,x0,x1,h){let d=`M${x0} ${y} `;for(let x=x0;x<x1;x+=per)d+=`q${per/4} ${-amp} ${per/2} 0 t${per/2} 0 `;return d+`L${x1} ${h} L${x0} ${h} Z`;}
const W='#FFFFFF', SK=`stroke="${W}" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"`;
const ICONS={
  lifebuoy:`<circle cx="50" cy="50" r="30" fill="none" stroke="${W}" stroke-opacity=".45" stroke-width="18"/><circle cx="50" cy="50" r="30" fill="none" stroke="${W}" stroke-width="18" stroke-dasharray="23.6 23.6" transform="rotate(-11 50 50)"/>`,
  hull:`<path d="M10 55 L90 55 L78 75 L22 75 Z" fill="${W}"/><path d="M34 55 L34 38 L64 38 L72 55" ${SK}/><path d="M8 90 q10.5 -7 21 0 t21 0 t21 0 t21 0" ${SK}/>`,
  propeller:`<circle cx="50" cy="50" r="9" fill="${W}"/>`+[0,120,240].map(a=>`<ellipse cx="50" cy="25" rx="11" ry="20" fill="${W}" transform="rotate(${a} 50 50)"/>`).join(''),
  quiz:`<rect x="16" y="12" width="68" height="80" rx="10" ${SK}/><path d="M30 34 L40 44 L56 26 M30 62 L70 62 M30 76 L60 76" ${SK}/>`,
  book:`<path d="M50 24 Q30 12 10 18 L10 82 Q30 76 50 88 Q70 76 90 82 L90 18 Q70 12 50 24 Z M50 24 L50 88" ${SK}/>`,
  chart:`<path d="M12 88 L90 88" ${SK}/><rect x="18" y="50" width="16" height="36" rx="3" fill="${W}"/><rect x="42" y="26" width="16" height="60" rx="3" fill="${W}"/><rect x="66" y="60" width="16" height="26" rx="3" fill="${W}"/>`,
  compass:`<circle cx="50" cy="50" r="38" ${SK}/><polygon points="50,14 58,50 50,86 42,50" fill="${W}"/><polygon points="14,50 50,42 86,50 50,58" fill="${W}" fill-opacity=".7"/>`,
  flag:`<path d="M24 10 L24 92" ${SK}/><path d="M28 14 L82 14 L70 32 L82 50 L28 50 Z" fill="${W}"/>`};
function svgEl(html,cls,vb){const s=document.createElementNS('http://www.w3.org/2000/svg','svg');s.setAttribute('viewBox',vb);if(cls)s.setAttribute('class',cls);s.setAttribute('aria-hidden','true');s.innerHTML=html;return s;}
const badge=(icon,hue)=>svgEl(`<path d="${blob(52,52,47,1,.07,8)}" fill="${hue}"/><g transform="translate(22 22) scale(.6)">${ICONS[icon]}</g>`,'badge','0 0 104 104');
const squiggle=(hue,w=150)=>{const s=svgEl(`<path d="M5 9 ${Array(Math.floor(w/44)).fill('q11 -10 22 0 t22 0').join(' ')}" fill="none" stroke="${hue}" stroke-width="7" stroke-linecap="round"/>`,'squig',`0 0 ${w} 18`);s.style.width=w*.8+'px';return s;};
function logo(dark){const ring=dark?'#FFF8EE':'var(--ink)',acc=dark?'#FFC145':'var(--coral)',wv=dark?'#7FD3DC':'var(--sea)';
  const ticks=[0,45,90,135,180,225,315].map(d=>{const a=d*Math.PI/180;return `<line x1="${100+78*Math.cos(a)}" y1="${100+78*Math.sin(a)}" x2="${100+86*Math.cos(a)}" y2="${100+86*Math.sin(a)}" stroke="${ring}" stroke-width="4" stroke-linecap="round"/>`}).join('');
  return svgEl(`<circle cx="100" cy="100" r="92" fill="none" stroke="${ring}" stroke-width="7"/>${ticks}<path d="M100 16 L109 34 L91 34 Z" fill="${acc}"/><path d="M97 42 L97 132 L46 132 Q66 92 97 42 Z" fill="${ring}"/><path d="M104 54 L104 132 L148 132 Q128 96 104 54 Z" fill="${acc}"/><path d="M44 140 L156 140 Q148 156 126 158 L74 158 Q52 156 44 140 Z" fill="${ring}"/><path d="M50 173 Q62.5 165 75 173 T100 173 T125 173 T150 173" fill="none" stroke="${wv}" stroke-width="6" stroke-linecap="round"/>`,'', '0 0 200 200');}
document.getElementById('logo-h').append(logo(true));
document.getElementById('logo-f').append(logo(false));
document.getElementById('wv-h').setAttribute('d',wave(8,6,60,-30,1000,14));
document.getElementById('backdrop').append(
  Object.assign(svgEl(`<path d="${blob(300,120,240,1.3)}" fill="var(--sun-t)"/>`,'','0 0 600 400'),{style:'right:-160px; top:40px; width:520px'}),
  Object.assign(svgEl(`<path d="${blob(200,260,200,0.7)}" fill="var(--sea-t)"/>`,'','0 0 400 400'),{style:'left:-180px; bottom:-120px; width:420px'}),
  Object.assign(svgEl(`<circle cx="20" cy="20" r="18" fill="var(--coral)" fill-opacity=".18"/><circle cx="50" cy="70" r="9" fill="var(--sea)" fill-opacity=".25"/>`,'','0 0 80 90'),{style:'right:28px; top:46%; width:70px'}));

  async load(){

    try{

function vQuiz(set,state){
  state=state||{scelte:{},controllato:false};
  const back=()=>{const r=set.ritorno; if(r[0]==='lezione')go(vLezione,r[1]); else if(r[0]==='raccolta')go(vRaccolta,r[1],r[2]); else go(vHome);};
  const pronti=set.ids.every(q=>state.scelte[q]!=null);
  const items=set.ids.map((qid,n)=>{const q=C.quiz[qid], scelta=state.scelte[qid];
    const opts=q.r.map((r,j)=>{
      const cls=state.controllato?(j===q.x?'opt right':(j===scelta?'opt wrong':'opt')):'opt';
      return el('button',{class:cls,type:'button',role:'checkbox','aria-checked':String(!state.controllato&&scelta===j),disabled:state.controllato,
        onclick:()=>{state.scelte[qid]=j; vQuiz(set,state);}},el('span',{class:'box'}),el('span',{},'abc'[j]+') '+r));});
    let fb=null;
    if(state.controllato){ const ok=scelta===q.x, a=S.risposte[qid], recuperata=!ok&&a&&a.ok;
      fb=ok?el('div',{class:'fb ok'},'Giusto.'):recuperata?el('div',{class:'fb ok'},'Recuperata: l’hai poi rifatta giusta (tentativo '+a.tentativi+').'):el('div',{class:'fb ko'},el('span',{},'Sbagliato: la risposta esatta è la '+'abc'[q.x]+').'),
        el('button',{class:'link',onclick:()=>{window.scrollTo({top:0}); vRivedi(qid,set,state);}},'Rivedi l’argomento → '+lez(q.rivedi[0]).num+', slide '+q.rivedi[1]));}
    return el('div',{class:'card q'},el('p',{class:'qid'},'Domanda '+(n+1)+' · quiz '+qid),el('p',{class:'txt'},q.d),...opts,fb);});
  // un errore rifatto giusto in seguito conta come recuperato anche rivedendo il vecchio tentativo
  const sbagliate=set.ids.filter(q=>state.scelte[q]!==C.quiz[q].x && !(state.controllato && S.risposte[q] && S.risposte[q].ok));
  const giusti=set.ids.length-sbagliate.length;
  const hue=giusti===set.ids.length?'var(--sea)':'var(--coral)';
  $app.replaceChildren(el('div',{class:'stack',style:'gap:16px'},
    el('button',{class:'link',onclick:back},'← Indietro'),
    head('Quiz ufficiali DD 131/2022',set.titolo,'var(--coral)','quiz',true),
    ...items,
    state.controllato?el('div',{class:'card result',style:'--hue:'+hue},
        el('div',{},el('div',{class:'big'},giusti+' / '+set.ids.length),el('p',{class:'muted',style:'font-weight:800'},giusti===set.ids.length?(set.ids.some(q=>state.scelte[q]!==C.quiz[q].x)?'Errori recuperati: avanti così.':'Tutte giuste: avanti così.'):'Rivedi l’argomento e riprova gli errori.')),
        el('div',{class:'row'},sbagliate.length?el('button',{class:'btn coral',onclick:()=>go(vQuiz,{titolo:'Riprova gli errori',ids:sbagliate,ritorno:set.ritorno})},'Riprova gli errori'):null,
          el('button',{class:'btn sea',onclick:back},'Continua'))):
      el('div',{class:'row'},el('button',{class:'btn sea',disabled:!pronti,onclick:()=>{
        state.controllato=true; const now=new Date().toISOString();
        for(const q of set.ids){const prev=S.risposte[q]; S.risposte[q]={ok:state.scelte[q]===C.quiz[q].x,scelta:state.scelte[q],ts:now,tentativi:(prev?prev.tentativi:0)+1,rivisto:!!(prev&&prev.rivisto)};}
        store.save(); vQuiz(set,state);}},'Controlla le risposte'),
        pronti?null:el('span',{class:'muted'},'Scegli una risposta per ogni domanda'))));
}

/* ---------- storico ---------- */
function vStorico(){
  const rows=C.lezioni.map(l=>{const s=stato(l.id); return el('tr',{},el('td',{},el('span',{class:'lt'},l.num+' · '+l.titolo),el('span',{class:'sh'},l.num.replace('Lezione ','L'))),el('td',{class:'num'},s.viste+' / '+s.pagine),el('td',{class:'num'},s.fatti+' / '+s.quiz),el('td',{class:'num'},s.giusti),el('td',{class:'num'},s.recuperati),el('td',{class:'num'},s.errati));});
  const err=errati();
  $app.replaceChildren(el('div',{class:'stack',style:'gap:20px'},
    el('button',{class:'link',onclick:()=>go(vHome)},'← Home'),
    head('Storico','I tuoi progressi','var(--purple)','chart',true),
    el('div',{class:'card tbl',style:'--hue:var(--purple)'},el('table',{},el('thead',{},el('tr',{},el('th',{},'Lezione'),el('th',{class:'num'},'Slide'),el('th',{class:'num'},'Quiz',el('span',{class:'lt'},' risposti')),el('th',{class:'num'},'Giusti'),el('th',{class:'num'},el('span',{class:'lt'},'Recuperati'),el('span',{class:'sh'},'Recup.')),el('th',{class:'num'},el('span',{class:'lt'},'Da ripassare'),el('span',{class:'sh'},'Errati')))),el('tbody',{},...rows))),
    el('p',{class:'muted'},'«Recuperati»: quiz sbagliati la prima volta e poi rifatti giusti.'),
    head('Da ripassare','Quiz sbagliati','var(--coral)','flag',false),
    err.length?el('div',{class:'card',style:'--hue:var(--coral)'},...err.map((q,i)=>{const Q=C.quiz[q], a=S.risposte[q];return el('div',{class:'cap',style:'--hue:var(--coral)'},el('span',{class:'dot'},String(i+1)),
        el('div',{class:'stack',style:'gap:4px; min-width:0'},el('div',{class:'row',style:'gap:8px'},el('span',{class:'chip'},'quiz '+q),el('span',{class:'chip ko'},a.tentativi+(a.tentativi===1?' tentativo':' tentativi')),a.rivisto?el('span',{class:'chip rev'},'slide rivista'):null),el('p',{style:'font-weight:700'},Q.d)),
        el('div',{class:'row acts',style:'gap:8px; justify-content:flex-end'},el('button',{class:'btn ghost',onclick:()=>{window.scrollTo({top:0}); vRivedi(q,{titolo:'Riprova la domanda',ids:[q],ritorno:['home']},{scelte:{},controllato:false});}},'Rivedi'),el('button',{class:'btn coral',onclick:()=>go(vQuiz,{titolo:'Riprova la domanda',ids:[q],ritorno:['home']})},'Riprova')));})):
      el('p',{class:'muted'},'Nessun errore da ripassare. Ottimo lavoro.'),
    head('Da capo','Ricomincia il corso','var(--blue)','lifebuoy',false),
    resetCard(),
    mode==='aula'?el('div',{class:'card reset',style:'--hue:var(--sea)'},el('p',{class:'muted',style:'font-weight:700'},'Telefono o tablet in prestito? Esci quando hai finito: i progressi restano salvati in aula.'),
      el('button',{class:'btn ghost',onclick:()=>{store.flush(); tok.set(null); S=blank(); renderWho(); go(vRegistrazione);}},'Esci da questo dispositivo')):null,
    localNote()));
}
function resetCard(){
  const box=el('div',{class:'card reset',style:'--hue:var(--blue)'});
  const ask=()=>box.replaceChildren(
    el('p',{style:'font-weight:700'},'Azzeri slide studiate, risposte e storico dei quiz. Il nome resta. Non si torna indietro.'),
    el('div',{class:'row',style:'gap:8px'},el('button',{class:'btn ghost',onclick:()=>{box.replaceChildren(...first())}},'Annulla'),
      el('button',{class:'btn coral',onclick:()=>{S.visti={}; S.risposte={}; store.save(); store.flush(); go(vHome);}},'Sì, azzera tutto')));
  const first=()=>[el('p',{class:'muted',style:'font-weight:700'},'Vuoi ripartire da zero, come il primo giorno?'),
    el('button',{class:'btn ghost',onclick:ask},'Ricomincia da capo')];
  box.append(...first()); return box;
}

/* ---------- avvio ---------- */
document.getElementById('home-btn').addEventListener('click',()=>{ if(S&&S.nome) go(vHome); });
document.getElementById('nav-home').addEventListener('click',()=>{ if(S&&S.nome) go(vHome); });
document.getElementById('nav-prog').addEventListener('click',()=>{ if(S&&S.nome) go(vStorico); });
(async function start(){
  try{ C=await (await fetch('corso.json')).json(); }
  catch(e){ $app.replaceChildren(el('div',{class:'stack'},el('h1',{},'Non riesco a caricare il corso'),el('p',{class:'muted'},'Ricarica la pagina; se il problema resta, avvisa l’istruttore.'))); return; }
  S=blank(); vRegistrazione();
  S=await store.load(); renderWho();
  if(S.nome) go(vHome); else vRegistrazione();
})();
})();
</script>
