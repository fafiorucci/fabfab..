name: Build e pubblicazione (GitHub Pages)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skipper
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: skipper/package-lock.json

      - run: npm ci
      - run: npm run check
      - run: npm test

      - name: Build Skipper Meteo
        run: npm run build
        env:
          # https://<utente>.github.io/<repo>/skipper
          BASE_PATH: /${{ github.event.repository.name }}/skipper

      - name: Componi il sito
        working-directory: .
        run: |
          mkdir -p _site/skipper
          cp index.html style.css app.js _site/
          cp -r skipper/build/. _site/skipper/

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}skipper/
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
