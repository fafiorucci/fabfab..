<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ricettario di casa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  :root {
    --bg: #F6F3EF;
    --surface: #FFFDFB;
    --ink: #27231F;
    --muted: #6B635B;
    --line: #E6DFD6;
    --basil: #6A5577;
    --basil-soft: #EDE6F0;
    --saffron: #B9785C;
    --saffron-soft: #F6E6DC;
    --danger: #B3372B;
    --shadow: 0 1px 2px rgba(39, 35, 31, .04), 0 12px 32px rgba(39, 35, 31, .06);
    --serif: "Fraunces", "Iowan Old Style", Georgia, serif;
    --sans: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #141214;
      --surface: #1E1B1E;
      --ink: #EFEAEE;
      --muted: #ADA4AB;
      --line: #332E33;
      --basil: #CDB7DA;
      --basil-soft: #2C2530;
      --saffron: #E6B39C;
      --saffron-soft: #3A2A24;
      --danger: #EE7A6C;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #141214;
    --surface: #1E1B1E;
    --ink: #EFEAEE;
    --muted: #ADA4AB;
    --line: #332E33;
    --basil: #CDB7DA;
    --basil-soft: #2C2530;
    --saffron: #E6B39C;
    --saffron-soft: #3A2A24;
    --danger: #EE7A6C;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    transition: background-color .6s ease, color .6s ease;
    color: var(--ink);
    font: 15px/1.55 var(--sans);
    padding-inline: 16px;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--saffron); outline-offset: 2px; }

  .wrap { max-width: 1160px; margin: 0 auto; padding-block: 28px 56px; display: grid; gap: 28px; }

  /* Testata */
  .masthead { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px 24px; padding-bottom: 8px; }
  .kicker { margin: 0 0 10px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .14em; color: var(--basil); }
  .masthead h1 { font: 350 clamp(44px, 7.5vw, 88px)/.95 var(--serif); margin: 0; letter-spacing: -.025em; text-wrap: balance; }
  .masthead h1 em { color: var(--basil); font-weight: 300; }
  .tagline { margin: 14px 0 0; color: var(--muted); font-size: 17px; max-width: 52ch; }
  .stats { display: flex; flex-wrap: wrap; gap: 8px; font-variant-numeric: tabular-nums; }
  .stat { display: inline-flex; align-items: baseline; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 8px 16px; transition: background-color .6s, border-color .6s; }
  .stat b { font: 400 22px/1 var(--serif); }
  .stat span { font-size: 12px; color: var(--muted); }

  /* Layout a due colonne */
  .app { display: grid; grid-template-columns: 330px minmax(0, 1fr); gap: 32px; align-items: start; }
  @media (max-width: 860px) {
    .app { grid-template-columns: minmax(0, 1fr); }
    .app[data-view="list"] .detail { display: none; }
    .app[data-view="detail"] .index { display: none; }
  }
  @media (min-width: 861px) { .back { display: none !important; } }

  /* Indice */
  .index { display: grid; gap: 16px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); }
  @media (max-width: 860px) { .index { position: static; } }
  .search { position: relative; }
  .search input {
    width: 100%; padding: 11px 14px 11px 38px; border: 1px solid var(--line); border-radius: 999px;
    background: var(--surface);
  }
  .search svg { position: absolute; left: 12px; top: 50%; translate: 0 -50%; width: 16px; height: 16px; stroke: var(--muted); fill: none; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 4px 12px;
    font-size: 13px; cursor: pointer; color: var(--muted);
  }
  .chip:hover { border-color: var(--basil); color: var(--ink); }
  .chip[aria-pressed="true"] { background: var(--basil); border-color: var(--basil); color: var(--surface); }
  .list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); max-height: 60vh; overflow-y: auto; }
  @media (max-width: 860px) { .list { max-height: none; } }
  .list li { border-bottom: 1px solid var(--line); }
  .item {
    width: 100%; display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; text-align: left;
    background: none; border: 0; padding: 12px 12px; cursor: pointer; border-radius: 14px;
  }
  .item:hover { background: var(--basil-soft); }
  .item[aria-current="true"] { background: var(--basil-soft); }
  .item .name { font-weight: 600; display: flex; align-items: center; gap: 10px; }
  .dots { display: inline-flex; flex: none; }
  .dots i { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid var(--surface); margin-left: -4px; }
  .dots i:first-child { margin-left: 0; }
  .item .sub { padding-left: 36px; }
  .item .sub { grid-column: 1; font-size: 13px; color: var(--muted); }
  .item .star { grid-row: 1 / span 2; grid-column: 2; align-self: center; color: var(--saffron); }
  .empty { color: var(--muted); padding: 16px 4px; margin: 0; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer;
    border-radius: 999px; padding: 10px 18px; font-weight: 600; border: 1px solid var(--basil);
    background: var(--basil); color: var(--surface);
  }
  .btn:hover { filter: brightness(1.08); }
  .btn.ghost { background: transparent; color: var(--basil); }
  .btn.danger { background: var(--danger); border-color: var(--danger); color: var(--bg); }
  .btn.small { padding: 6px 12px; font-size: 13px; }

  /* Scheda ricetta */
  .card { --pad: clamp(20px, 4vw, 40px); background: var(--surface); border: 1px solid var(--line); border-radius: 28px; box-shadow: var(--shadow); padding: var(--pad); display: grid; gap: 26px; transition: background-color .6s, border-color .6s; }

  /* Copertina della ricetta: i toni del piatto */
  .hero {
    margin: calc(-1 * var(--pad)) calc(-1 * var(--pad)) 0; padding: calc(var(--pad) + 4px) var(--pad);
    border-radius: 27px 27px 0 0; background: linear-gradient(135deg, var(--basil-soft) 0%, var(--saffron-soft) 100%);
    display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 24px; align-items: end;
  }
  .hero-text { display: grid; gap: 0; }
  .card .hero h2 { font: 350 clamp(40px, 6.2vw, 76px)/.98 var(--serif); letter-spacing: -.025em; margin: 8px 0 0; text-wrap: balance; }
  .claim { margin: 14px 0 0; font: 500 17px/1.45 var(--sans); max-width: 44ch; }
  .quote { margin: 12px 0 0; font: italic 350 22px/1.3 var(--serif); color: var(--basil); max-width: 40ch; }
  .palette { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 20px; }
  .sw { display: inline-flex; align-items: center; gap: 8px; padding: 4px 12px 4px 4px; border-radius: 999px; background: var(--surface); font-size: 12px; font-weight: 500; }
  .sw i { width: 22px; height: 22px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .08); }
  .hero-side { display: grid; justify-items: end; align-content: space-between; gap: 16px; align-self: stretch; }
  .hero-fig { margin: 0; display: grid; gap: 8px; justify-items: center; }
  .hero-fig img { display: block; width: 200px; max-width: 100%; height: auto; border-radius: 22px; border: 6px solid var(--surface); box-shadow: 0 14px 34px rgba(0, 0, 0, .10); rotate: 2.5deg; }
  .hero-fig figcaption { font-size: 11px; color: var(--muted); }
  @media (max-width: 640px) {
    .hero { grid-template-columns: minmax(0, 1fr); }
    .hero-side { justify-items: start; grid-auto-flow: column; align-items: end; justify-content: space-between; }
  }
  .ingr-fig { margin: 0 0 14px; }
  .ingr-fig img { display: block; width: 200px; max-width: 100%; height: auto; border-radius: 18px; }
  .back { justify-self: start; margin-bottom: 12px; }
  .eyebrow { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .1em; color: var(--basil); }
  .card h2 { font: 400 clamp(34px, 5vw, 52px)/1.02 var(--serif); margin: 4px 0 0; text-wrap: balance; }
  .lede { margin: 10px 0 0; color: var(--muted); max-width: 62ch; font-size: 16px; }
  .fav {
    flex: none; width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--surface);
    cursor: pointer; display: grid; place-items: center; color: var(--muted);
  }
  .fav svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; }
  .fav[aria-pressed="true"] { color: var(--saffron); border-color: var(--saffron); background: var(--saffron-soft); }
  .fav[aria-pressed="true"] svg { fill: currentColor; }

  .meta { display: flex; flex-wrap: wrap; gap: 10px; }
  .meta > div { display: grid; gap: 2px; background: var(--bg); border-radius: 18px; padding: 10px 18px; transition: background-color .6s; }
  .meta span { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .meta b { font-weight: 600; font-variant-numeric: tabular-nums; }
  .stepper { display: flex; align-items: center; gap: 8px; }
  .stepper button {
    width: 26px; height: 26px; border-radius: 50%; border: 0; background: var(--surface);
    cursor: pointer; line-height: 1; display: grid; place-items: center;
  }
  .stepper button:hover { border-color: var(--basil); }
  .stepper button:disabled { opacity: .4; cursor: default; }

  .body { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 36px; }
  @media (max-width: 640px) { .body { grid-template-columns: minmax(0, 1fr); } }
  .body h3 { font: 400 26px/1.1 var(--serif); margin: 0 0 10px; }
  .hint { font-size: 12px; color: var(--muted); margin: -4px 0 10px; }
  .ingr { list-style: none; margin: 0; padding: 0; }
  .ingr li { border-bottom: 1px dashed var(--line); }
  .ingr label { display: grid; grid-template-columns: 18px 96px 1fr; gap: 10px; align-items: baseline; padding: 8px 0; cursor: pointer; }
  .ingr input { accent-color: var(--basil); translate: 0 2px; }
  .qty { font: 500 13px/1.4 var(--mono); font-variant-numeric: tabular-nums; color: var(--basil); text-align: right; }
  .qty.qb { color: var(--muted); font-style: italic; }
  .ingr input:checked ~ span { text-decoration: line-through; opacity: .5; }

  .steps { margin: 0; padding: 0; list-style: none; counter-reset: s; display: grid; gap: 14px; }
  .steps li { counter-increment: s; display: grid; grid-template-columns: 34px 1fr; gap: 14px; max-width: 64ch; align-items: start; }
  .steps li::before {
    content: counter(s); width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center;
    font: 500 16px/1 var(--serif); background: var(--saffron-soft); color: var(--ink);
  }
  .note { background: var(--saffron-soft); border-radius: 18px; padding: 12px 16px; font-size: 14px; }
  .note b { color: var(--ink); }
  .note.check { background: var(--basil-soft); }
  .cene { display: grid; gap: 6px; }
  .cene .list { max-height: none; }
  .portate { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  .portate > li { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 8px 20px; padding: 16px 0; border-bottom: 1px dashed var(--line); }
  @media (max-width: 560px) { .portate > li { grid-template-columns: minmax(0, 1fr); } }
  .portata { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .1em; color: var(--basil); padding-top: 8px; }
  .piatti { display: grid; gap: 12px; }
  .piatto { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
  .piatto .nome { font: 400 26px/1.15 var(--serif); }
  .piatto .nota { flex-basis: 100%; color: var(--muted); font-size: 14px; }
  .stato { font-size: 12px; border-radius: 999px; padding: 2px 10px; background: var(--saffron-soft); color: var(--ink); white-space: nowrap; }
  .stato.ok { background: var(--basil-soft); }
  .linkbtn { background: none; border: 0; padding: 0; color: var(--basil); font-weight: 600; font-size: 13px; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
  .storia { display: grid; gap: 12px; max-width: 64ch; }
  .storia p { margin: 0; font: 350 19px/1.6 var(--serif); }
  .storia p:first-of-type::first-letter { float: left; font-size: 3.6em; line-height: .8; padding: 6px 10px 0 0; color: var(--basil); font-weight: 300; }
  .storia .storia-nota { font: 12px/1.4 var(--sans); color: var(--muted); }
  .risposte { margin: 8px 0 0; display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; }
  .risposte dt { font-weight: 600; }
  .risposte dd { margin: 0; }
  @media (max-width: 560px) { .risposte { grid-template-columns: 1fr; gap: 2px; } .risposte dd { margin-bottom: 6px; } }
  .note ul { margin: 6px 0 0; padding-left: 18px; display: grid; gap: 4px; }
  .owner-actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; border-top: 1px solid var(--line); padding-top: 18px; }
  .owner-actions p { margin: 0; color: var(--muted); font-size: 13px; }

  /* Modulo */
  form.card { gap: 18px; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; }
  .field { display: grid; gap: 6px; }
  .field label { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .field input, .field select, .field textarea {
    width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg);
  }
  .field textarea { min-height: 150px; resize: vertical; line-height: 1.5; }
  .field small { color: var(--muted); font-size: 12px; }
  .error { color: var(--danger); font-size: 14px; margin: 0; }
  .form-actions { display: flex; gap: 10px; flex-wrap: wrap; }

  .toast {
    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); translate: -50% 0;
    background: var(--ink); color: var(--surface); padding: 10px 18px; border-radius: 999px; font-size: 14px;
    box-shadow: var(--shadow); transition: opacity .2s; pointer-events: none;
  }
  .toast[data-show="false"] { opacity: 0; }
  @media (prefers-reduced-motion: reduce) { .toast, body, .card, .stat, .meta > div { transition: none; } }
</style>

<div class="wrap">
  <header class="masthead">
    <div>
      <p class="kicker">1968 — 1998 · una villa, trent'anni di cene</p>
      <h1>Ricettario <em>di casa</em></h1>
      <p class="tagline">Scritte a mano sui taccuini, ricopiate nei quaderni, servite a tavole illustri. Ogni ricetta porta con sé i colori del suo piatto.</p>
    </div>
    <div class="stats" id="stats"></div>
  </header>

  <div class="app" id="app" data-view="list">
    <aside class="index" aria-label="Indice delle ricette">
      <section class="cene" aria-label="Le cene">
        <div class="eyebrow">Le cene</div>
        <ul class="list" id="cene"></ul>
      </section>
      <div class="eyebrow">Le ricette</div>
      <div class="search">
        <svg viewBox="0 0 24 24" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
        <input id="q" type="search" placeholder="Cerca per nome o ingrediente" aria-label="Cerca ricette">
      </div>
      <div class="chips" id="chips" role="group" aria-label="Filtra per portata"></div>
      <ul class="list" id="list"></ul>
      <button class="btn" id="new" type="button">+ Nuova ricetta</button>
    </aside>

    <main class="detail" id="detail" aria-live="polite"></main>
  </div>
</div>
<div class="toast" id="toast" data-show="false" role="status"></div>

<script>
(() => {
  const CATEGORIE = ["Primi", "Secondi", "Contorni", "Salse", "Lievitati", "Dolci"];
  const LIVELLI = ["Facile", "Media", "Impegnativa"];

  // q: quantità per le dosi base; null = quanto basta
  const i = (q, u, nome) => ({ q, u, nome });
  // Ricette trascritte dagli originali: testo fedele, quantità strutturate per il ricalcolo.
  // tempo e difficoltà sono stime; "daVerificare" raccoglie i dubbi di lettura da chiarire con l'autore.
  const BASE = [
    {
      id: "torta-banane", immagini: true, tono: "banane", claim: "Il frutto più pop degli anni Sessanta, montato a mano in un dolce da forno di casa.", citazione: "Più si sbatte e meglio è.", storia: ["Sul finire degli anni Sessanta la banana smette di essere un lusso. Fino alla metà del decennio in Italia la sua importazione era un monopolio di Stato, e il frutto arrivava in tavola come una rarità; poi il mercato si apre e i caschi gialli diventano merce di tutti i giorni. Nel 1967 Andy Warhol l'aveva trasformata in un'icona, stampandola sulla copertina del primo disco dei Velvet Underground: la banana era pop, americana, moderna.", "Questa torta porta con sé quell'aria nuova dentro una struttura antica. È costruita come un plum cake all'inglese, burro e zucchero montati a lungo, le uova una alla volta, la farina a pioggia, con la raccomandazione di chi l'ha fatta molte volte: «più si sbatte e meglio è». Il frutto dei tropici entra in un impasto da pasticceria borghese.", "La ricetta non sta nei quaderni. È scritta con l'inchiostro verde su un foglio a quadretti, rimasto tra le pagine: una ricetta annotata a parte, che aspettava di essere ricopiata."], titolo: "Torta alle banane", categoria: "Dolci", fonte: "foglio sciolto a quadretti, inchiostro verde",
      tempo: 65, dosi: 1, dosiLabel: ["torta", "torte"], difficolta: "Facile",
      ingredienti: [i(300, "g", "farina"), i(250, "g", "burro"), i(250, "g", "zucchero"), i(4, "", "uova"), i(1, "bustina", "lievito"), i(2, "", "banane grosse")],
      passi: [
        "Sbattere lo zucchero con il burro, aggiungere una alla volta le uova sbattendo sempre e alternando alla farina (più si sbatte e meglio è).",
        "Mettere in ultimo il lievito e mettere in una teglia imburrata.",
        "Infornare a 200° per 45 minuti."
      ],
      daVerificare: ["Il procedimento non dice quando e come si aggiungono le banane (schiacciate nell'impasto? a fette sopra?)."]
    },
    {
      id: "torta-mele", immagini: true, tono: "mele", claim: "Pane, mele e latte: la torta che non ha bisogno di farina.", citazione: "Servire la torta tiepida, anche con panna liquida.", storia: ["Il quaderno la chiama semplicemente torta di mele, ma la farina non c'è. A sostenerla sono le fette di pane imburrate, le mele sottili e il latte che il forno trasforma in crema. Appartiene a una famiglia antica di dolci del recupero, in cui il pane del giorno prima diventa impalcatura: la miascia dei laghi lombardi, la charlotte di mele francese, il bread and butter pudding inglese.", "Il cedro candito, l'uvetta e la cannella la spostano però verso la pasticceria delle feste, e il finale, «anche con panna liquida», verso una tavola di ospiti. Negli anni in cui la cucina dei ristoranti inseguiva la leggerezza della nouvelle cuisine, piatti come questo custodivano il sapore domestico, quello che gli ospiti di una villa non avrebbero trovato altrove.", "Le mele, del resto, sono il frutto più dipinto della storia dell'arte: lucide nelle nature morte del Seicento, costruite come architetture nelle tele di Cézanne, che diceva di voler stupire Parigi con una mela."], titolo: "Torta di mele", categoria: "Dolci", fonte: "quaderno, p. 20, inchiostro blu",
      tempo: 90, dosi: 1, dosiLabel: ["pirofila", "pirofile"], difficolta: "Facile",
      ingredienti: [i(1000, "g", "mele"), i(100, "g", "zucchero"), i(200, "g", "burro"), i(50, "g", "uvette ben lavate"), i(null, "", "pezzetti di cedro candito"), i(1, "scorza", "di limone, grattata"), i(null, "", "fette di pane sottilissime"), i(1, "bicchiere", "latte"), i(1, "pizzico", "cannella")],
      passi: [
        "Imburrare da ambo le parti le fettine di pane.",
        "Sbucciate le mele, affettatele sottilmente, mescolatele con zucchero, cannella, uvette, raschiatura di limone, cedro candito.",
        "Quindi in una pirofila ben imburrata disporre a strati le fette di pane e il composto di mele, terminando con queste ultime.",
        "Versarvi il latte e passare in forno moderato per circa un'ora.",
        "Servire la torta tiepida nella pirofila di cottura, anche con panna liquida."
      ],
      daVerificare: ["«Forno moderato»: probabilmente 170–180 °C, da confermare.", "Quanto pane serve? Il quaderno non indica una quantità."]

            ${paletteHtml(r.tono)}
          </div>
          <div class="hero-side">
            <button type="button" class="fav" data-action="fav" aria-pressed="${fav}" aria-label="${fav ? "Togli dalle preferite" : "Aggiungi alle preferite"}">${starSvg}</button>
            ${r.immagini ? `<figure class="hero-fig"><img src="img/${esc(r.id)}-piatto.jpg" alt="Il piatto finito: ${esc(r.titolo)}, illustrazione ad acquerello" width="200" height="149"><figcaption>Illustrazione, non una foto della ricetta</figcaption></figure>` : ""}
          </div>
        </header>
        ${storiaHtml(r.storia)}
        <div class="meta">
          <div><span>${r.fonte ? "Tempo stimato" : "Tempo"}</span><b>${durata(r.tempo)}</b></div>
          <div><span>Dosi</span>
            <div class="stepper">
              <button type="button" data-action="less" aria-label="Diminuisci dosi" ${dosi <= 1 ? "disabled" : ""}>−</button>
              <b id="dosi">${dosi} ${esc(label)}</b>
              <button type="button" data-action="more" aria-label="Aumenta dosi" ${dosi >= 24 ? "disabled" : ""}>+</button>
            </div>
          </div>
          <div><span>Difficoltà</span><b>${esc(r.difficolta)}</b></div>
        </div>
        ${r.riposo ? `<div class="note"><b>Da sapere:</b> oltre al tempo di preparazione servono ${esc(r.riposo)}.</div>` : ""}
        ${r.daVerificare ? `<div class="note check"><b>Da chiedere o verificare</b><ul>${r.daVerificare.map(d => `<li>${esc(d)}</li>`).join("")}</ul></div>` : ""}
        <div class="body">
          <section>
            <h3>Ingredienti</h3>
            ${r.immagini ? `<figure class="ingr-fig"><img src="img/${esc(r.id)}-ingredienti.jpg" alt="Gli ingredienti: ${esc(r.titolo)}, illustrazione ad acquerello" width="200" height="149" loading="lazy"></figure>` : ""}
            <p class="hint">${factor === 1 ? "Spunta quello che hai già sul piano di lavoro." : `Quantità ricalcolate per ${dosi} (ricetta originale: ${r.dosi}).`}</p>
            <ul class="ingr">
              ${r.ingredienti.map((g, k) => {
                const f = formatQty(g, factor);
                const key = `${r.id}:${k}`;
                return `<li><label><input type="checkbox" id="ing-${esc(r.id)}-${k}" data-key="${esc(key)}" ${state.checked.has(key) ? "checked" : ""}><span class="qty${f.qb ? " qb" : ""}">${esc(f.text)}</span><span>${esc(g.nome)}</span></label></li>`;
              }).join("")}
            </ul>
          </section>
          <section>
            <h3>Procedimento</h3>
            ${r.fonte ? '<p class="hint">Testo trascritto fedelmente dall\'originale.</p>' : ""}
            <ol class="steps">${r.passi.map(p => `<li><span>${esc(p)}</span></li>`).join("")}</ol>
          </section>
        </div>
        ${r.mine ? `
          <div class="owner-actions">
            ${state.confirmDelete
              ? `<p>Eliminare “${esc(r.titolo)}”? Non si potrà recuperare.</p>
                 <button type="button" class="btn danger small" data-action="delete-yes">Elimina</button>
                 <button type="button" class="btn ghost small" data-action="delete-no">Annulla</button>`
              : `<p>Ricetta tua, salvata in questo browser.</p>
                 <button type="button" class="btn ghost small" data-action="edit">Modifica</button>
                 <button type="button" class="btn ghost small" data-action="delete">Elimina</button>`}
          </div>` : ""}
      </article>`;
  }

  function renderForm(r) {
    const val = (k, d = "") => esc(r ? r[k] : d);
    const ingr = r ? r.ingredienti.map(g => g.q == null ? `${g.nome} q.b.` : `${g.q}${g.u ? " " + g.u : ""} ${g.nome}`).join("\n") : "";
    const passi = r ? r.passi.join("\n") : "";
    $("#detail").innerHTML = `
      <form class="card" id="form" novalidate>
        <button type="button" class="btn ghost small back" data-action="back">← Tutte le ricette</button>
        <div>
          <div class="eyebrow">${r ? "Modifica ricetta" : "Nuova ricetta"}</div>
          <h2>${r ? esc(r.titolo) : "Scrivi la tua ricetta"}</h2>
        </div>
        <div class="field">
          <label for="f-titolo">Titolo</label>
          <input id="f-titolo" name="titolo" required value="${val("titolo")}" placeholder="Es. Polpette al sugo della nonna">
        </div>
        <div class="grid2">
          <div class="field">
            <label for="f-cat">Portata</label>
            <select id="f-cat" name="categoria">${CATEGORIE.map(c => `<option ${r && r.categoria === c ? "selected" : ""}>${c}</option>`).join("")}</select>
          </div>
          <div class="field">
            <label for="f-tempo">Tempo (minuti)</label>
            <input id="f-tempo" name="tempo" type="number" min="1" inputmode="numeric" value="${val("tempo", 30)}">
          </div>
          <div class="field">
            <label for="f-dosi">Dosi (persone)</label>
            <input id="f-dosi" name="dosi" type="number" min="1" max="24" inputmode="numeric" value="${val("dosi", 4)}">
          </div>
          <div class="field">
            <label for="f-diff">Difficoltà</label>
            <select id="f-diff" name="difficolta">${LIVELLI.map(l => `<option ${r && r.difficolta === l ? "selected" : ""}>${l}</option>`).join("")}</select>
          </div>
        </div>
        <div class="field">
          <label for="f-desc">Descrizione breve</label>
          <input id="f-desc" name="descrizione" value="${val("descrizione")}" placeholder="Una riga su cosa la rende speciale">
        </div>
        <div class="field">
          <label for="f-ingr">Ingredienti</label>
          <textarea id="f-ingr" name="ingredienti" placeholder="400 g macinato misto&#10;1 uovo&#10;50 g pane raffermo&#10;sale q.b.">${esc(ingr)}</textarea>
          <small>Uno per riga, quantità all'inizio (g, kg, ml, l, cucchiai…). Le righe senza numero diventano “q.b.” e non vengono ricalcolate.</small>
        </div>
        <div class="field">
          <label for="f-passi">Procedimento</label>
          <textarea id="f-passi" name="passi" placeholder="Ammolla il pane nel latte.&#10;Impasta con carne, uovo e formaggio.">${esc(passi)}</textarea>
          <small>Un passaggio per riga.</small>
        </div>
        <p class="error" id="f-err" hidden></p>
        <div class="form-actions">
          <button class="btn" type="submit">${r ? "Salva modifiche" : "Aggiungi al ricettario"}</button>
          <button class="btn ghost" type="button" data-action="${r ? "cancel-edit" : "back"}">Annulla</button>
        </div>
      </form>`;
    $("#f-titolo").focus({ preventScroll: true });
  }

  const storiaHtml = paras => paras ? `
        <section class="storia">
          <div class="eyebrow">Nel suo tempo</div>
          ${paras.map(t => `<p>${esc(t)}</p>`).join("")}
          <p class="storia-nota">Testo di contesto in bozza, da verificare in redazione. I ricordi di chi cucinava si aggiungeranno dalle interviste.</p>
        </section>` : "";

  function renderCene() {
    $("#cene").innerHTML = CENE.map(c => `
      <li><button type="button" class="item" data-cena="${esc(c.id)}" aria-current="${state.mode === "cena" && state.cena === c.id}">
        <span class="name">${dotsHtml(c.tono)}${esc(c.titolo)}</span>
        <span class="sub">${esc(c.quando)} · ${c.portate.filter(p => p.portata !== "I vini").length} portate e vini</span>
      </button></li>`).join("");
  }

  function renderCena() {
    const c = cenaById(state.cena);
    $("#detail").innerHTML = `
      <article class="card">
        <header class="hero">
          <div class="hero-text">
            <button type="button" class="btn ghost small back" data-action="back">← Tutte le ricette</button>
            <div class="eyebrow">Menu della cena · ${esc(c.quando)}</div>
            <h2>${esc(c.titolo)}</h2>
            <p class="claim">${esc(c.claim)}</p>
            <p class="quote">«${esc(c.citazione)}»</p>
            ${paletteHtml(c.tono)}
          </div>
        </header>
        ${storiaHtml(c.storia)}
        <ol class="portate">
          ${c.portate.map(p => `<li>
            <span class="portata">${esc(p.portata)}</span>
            <div class="piatti">${p.piatti.map(d => {
              const r = d.ricetta && byId(d.ricetta);
              return `<div class="piatto">
                <span class="nome">${esc(d.nome)}</span>
                ${r ? `<button type="button" class="linkbtn" data-open="${esc(r.id)}">Apri la ricetta</button>` : `<span class="stato${d.ok ? " ok" : ""}">${esc(d.stato)}</span>`}
                ${d.nota ? `<span class="nota">${esc(d.nota)}${d.simile && byId(d.simile) ? ` <button type="button" class="linkbtn" data-open="${esc(d.simile)}">Vedi ${esc(byId(d.simile).titolo)}</button>` : ""}</span>` : ""}
              </div>`;
            }).join("")}</div>
          </li>`).join("")}
        </ol>
        ${c.risposte ? `<div class="note"><b>Ricostruita con i ricordi</b><dl class="risposte">${c.risposte.map(([q, a]) => `<dt>${esc(q)}</dt><dd>${esc(a)}</dd>`).join("")}</dl></div>` : ""}
        <div class="note check"><b>Da chiedere ancora</b><ul>${c.domande.map(q => `<li>${esc(q)}</li>`).join("")}</ul></div>
      </article>`;
  }

  function openCena(id) {
    state.cena = id;
    state.mode = "cena";
    $("#app").dataset.view = "detail";
    try { history.replaceState(null, "", "#cena-" + id); } catch {}
    render();
    if (matchMedia("(max-width: 860px)").matches) $("#app").scrollIntoView({ block: "start" });
  }

  function render() {
    renderStats();
    renderChips();
    renderList();
    renderCene();
    applyTono(state.mode === "cena" ? cenaById(state.cena).tono : state.mode === "view" ? (byId(state.current) || {}).tono : null);
    if (state.mode === "cena") renderCena();
    else if (state.mode === "view") renderRecipe();
    else renderForm(state.mode === "edit" ? byId(state.current) : null);
  }

  // ---- Navigazione ----
  function open(id, { scroll = true } = {}) {
    state.current = id;
    state.mode = "view";
    state.confirmDelete = false;
    $("#app").dataset.view = "detail";
    try { history.replaceState(null, "", "#" + id); } catch {}
    render();
    if (scroll && matchMedia("(max-width: 860px)").matches) $("#app").scrollIntoView({ block: "start" });
  }

  $("#cene").addEventListener("click", e => {
    const b = e.target.closest(".item");
    if (b) openCena(b.dataset.cena);
  });
  $("#detail").addEventListener("click", e => {
    const b = e.target.closest("[data-open]");
    if (b) open(b.dataset.open);
  });
  $("#list").addEventListener("click", e => {
    const b = e.target.closest(".item");
    if (b) open(b.dataset.id);
  });
  $("#chips").addEventListener("click", e => {
    const b = e.target.closest(".chip");
    if (!b) return;
    state.cat = b.dataset.cat;
    renderChips(); renderList();
  });
  $("#q").addEventListener("input", e => { state.q = e.target.value; renderList(); });
  $("#new").addEventListener("click", () => {
    state.mode = "new";
    $("#app").dataset.view = "detail";
    render();
  });

  $("#detail").addEventListener("click", e => {
    const a = e.target.closest("[data-action]");
    if (!a) return;
    const r = byId(state.current);
    switch (a.dataset.action) {
      case "back":
        state.mode = "view";
        $("#app").dataset.view = "list";
        render();
        break;
      case "fav":
        state.fav.has(r.id) ? state.fav.delete(r.id) : state.fav.add(r.id);
        persist(); render();
        toast(state.fav.has(r.id) ? "Aggiunta alle preferite" : "Tolta dalle preferite");
        break;
      case "less":
      case "more": {
        const d = (state.servings[r.id] ?? r.dosi) + (a.dataset.action === "more" ? 1 : -1);
        state.servings[r.id] = Math.min(24, Math.max(1, d));
        renderRecipe();
        break;
      }
      case "edit": state.mode = "edit"; render(); break;
      case "cancel-edit": state.mode = "view"; render(); break;
      case "delete": state.confirmDelete = true; renderRecipe(); break;
      case "delete-no": state.confirmDelete = false; renderRecipe(); break;
      case "delete-yes":
        state.mine = state.mine.filter(x => x.id !== r.id);
        state.fav.delete(r.id);
        persist();
        toast("Ricetta eliminata");
        open(all()[0].id, { scroll: false });
        $("#app").dataset.view = "list";
        break;
    }
  });

  $("#detail").addEventListener("change", e => {
    const key = e.target.dataset && e.target.dataset.key;
    if (!key) return;
    e.target.checked ? state.checked.add(key) : state.checked.delete(key);
  });

  $("#detail").addEventListener("submit", e => {
    e.preventDefault();
    const f = new FormData(e.target);
    const err = $("#f-err");
    const titolo = String(f.get("titolo") || "").trim();
    const righe = k => String(f.get(k) || "").split("\n").map(s => s.trim()).filter(Boolean);
    const ingredienti = righe("ingredienti").map(parseIngrediente);
    const passi = righe("passi");
    const miss = [!titolo && "il titolo", !ingredienti.length && "almeno un ingrediente", !passi.length && "almeno un passaggio"].filter(Boolean);
    if (miss.length) {
      err.textContent = `Manca ${miss.join(", ")}.`;
      err.hidden = false;
      return;
    }
    const editing = state.mode === "edit";
    const slug = norm(titolo).replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "ricetta";
    let id = editing ? state.current : slug;
    if (!editing) { let n = 2; while (byId(id)) id = `${slug}-${n++}`; }
    const ricetta = {
      id, mine: true, titolo,
      categoria: String(f.get("categoria")),
      tempo: Math.max(1, parseInt(f.get("tempo"), 10) || 30),
      dosi: Math.min(24, Math.max(1, parseInt(f.get("dosi"), 10) || 4)),
      difficolta: String(f.get("difficolta")),
      descrizione: String(f.get("descrizione") || "").trim(),
      ingredienti, passi
    };
    state.mine = editing ? state.mine.map(x => (x.id === id ? ricetta : x)) : [...state.mine, ricetta];
    delete state.servings[id];
    for (const k of [...state.checked]) if (k.startsWith(id + ":")) state.checked.delete(k);
    persist();
    toast(editing ? "Modifiche salvate" : "Ricetta aggiunta");
    open(id);
  });

  // ---- Avvio ----
  const fromHash = decodeURIComponent(location.hash.slice(1));
  state.current = byId(fromHash) ? fromHash : BASE[0].id;
  state.cena = CENE[0].id;
  if (byId(fromHash)) $("#app").dataset.view = "detail";
  else if (cenaById(fromHash.replace(/^cena-/, "")) || !fromHash) {
    state.mode = "cena";
    state.cena = cenaById(fromHash.replace(/^cena-/, "")) ? fromHash.replace(/^cena-/, "") : CENE[0].id;
    if (fromHash) $("#app").dataset.view = "detail";
  }
  render();
  window.addEventListener("hashchange", () => {
    const id = decodeURIComponent(location.hash.slice(1));
    if (byId(id) && (id !== state.current || state.mode !== "view")) open(id);
    else if (id.startsWith("cena-") && cenaById(id.slice(5))) openCena(id.slice(5));
  });
})();
</script>
